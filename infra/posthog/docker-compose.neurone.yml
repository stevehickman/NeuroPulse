# NeurOne PostHog self-hosted analytics stack: NeurOne's layer over PostHog's own hobby compose file
# NP-ANALYTICS-001 §7.3 (OI-ANALYTICS-03)
#
# THE STACK IS THREE FILES, applied in this order (COMPOSE_FILE in .env names them, so `docker compose` reads all three):
#   docker-compose.hobby.yml   PostHog's hobby file at the pinned commit, byte for byte (it `extends` docker-compose.base.yml).
#   docker-compose.pin.yml     every image PostHog versions or builds, by digest, generated by pin_posthog.py.
#   docker-compose.neurone.yml this file: NeurOne's privacy controls. It names no PostHog image; the pin owns those.
# Moving PostHog means moving all three together: `python3 pin_posthog.py --commit <SHA>`, then the upgrade procedure of
# NP-ANALYTICS-001 §7.3. Never edit the two PostHog files; change this one.
#
# What this layer does, and the check that holds it (ci/test_posthog_infra.py):
#   - Every service's container log is bounded (P10; OI-PRIV-57, OI-PRIV-46 (1)). PostHog's own bound is 50 MB x 3.
#   - Every service sits on analytics-internal ONLY, an internal network with no route out, so no PostHog service can reach
#     the internet (no telemetry, no GeoIP download, no AI provider). Caddy alone is also on analytics-external (P5).
#   - No service publishes a port except Caddy (P4). PostHog publishes object storage, SeaweedFS and Temporal on 127.0.0.1;
#     those are removed. Caddy publishes 80/443 for TLS and container port 8000 on 127.0.0.1 only, for plain HTTP on this
#     machine (OI-PRIV-50).
#   - PostHog's own proxy is replaced by NeurOne's Caddy (caddy/Caddyfile), which strips the client's address from logs and
#     upstreams and serves only the capture, erasure and UI routes (P6, P8, P14).
#   - PostHog's privacy switches are set on every service that runs PostHog's app or Node image (P3).
#   - ClickHouse carries NeurOne's config and users (np-privacy.xml, np-erase-user.xml, np-retention-user.xml; P11, P13).
#   - The erasure relay runs beside it, after the ClickHouse version guard passes (clickhouse_version_guard.py).
# A service PostHog adds at an upgrade fails P5 and P10 until it is listed here: nothing new joins the stack unreviewed.
#
# First-time setup:
#   cp .env.example .env && open .env          # fill in every secret
#   python3 pin_posthog.py --fetch-tree         # PostHog's mounted config files, at the pinned commit (./posthog)
#   docker compose up -d
# NEVER run PostHog's bin/deploy-hobby or bin/upgrade-hobby here: they report the install to PostHog, download a GeoIP database
# and move the stack to whatever master is that day.

name: neurone-analytics

# Every service's container log is bounded (OI-PRIV-57, OI-PRIV-46 (1)). With no `logging:` Docker's default
# json-file driver keeps a container's output with no size or age limit, and these logs are where Caddy's access and
# error entries, PostHog's and the erasure relay's output go. `local` keeps at most max-file files of max-size each per
# container, compressed, and `docker compose logs` still reads them. This bounds SIZE, not age: Docker's log drivers
# have no age option, so how long a line survives depends on how much the service writes. The figures have no
# derivation (UC-211); ci/test_posthog_infra.py P10 holds every service to them.
x-logging: &bounded-logging
    driver: local
    options:
        max-size: "10m"
        max-file: "3"

# PostHog's privacy switches, on every service that runs PostHog's app or Node image (names checked at the pinned commit's
# posthog/settings: DISABLE_MMDB, OPT_OUT_CAPTURE, MULTI_ORG_ENABLED).
#   DISABLE_MMDB       no GeoIP: no address is turned into a country, city or region. The GeoIP database is also never
#                      downloaded (./share stays empty; PostHog's deploy-hobby is what fetches it).
#   OPT_OUT_CAPTURE    PostHog's documented opt-out of its own usage telemetry to posthog.com. The internal network is the
#                      second layer: nothing on it has a route out.
#   MULTI_ORG_ENABLED  one NeurOne organisation.
# Two switches the old layout set are gone: CAPTURE_INTERNAL_METRICS and SENTRY_DSN no longer exist in PostHog's settings, and
# OBJECT_STORAGE_ENABLED no longer stops session recording (recordings now go to SeaweedFS). Recording is refused at Caddy
# instead: /s is not routed (P14), and the project setting is the second layer (NP-ANALYTICS-001 §3.4).
x-posthog-privacy: &posthog-privacy
    DISABLE_MMDB: "true"
    OPT_OUT_CAPTURE: "true"
    MULTI_ORG_ENABLED: "false"

# PostHog's file reads these two as plain $VARs, so an unset one starts Django with an empty value. Required here instead.
x-posthog-env: &posthog-env
    <<: *posthog-privacy
    SECRET_KEY: ${POSTHOG_SECRET:?Set POSTHOG_SECRET in .env}
    ENCRYPTION_SALT_KEYS: ${ENCRYPTION_SALT_KEYS:?Set ENCRYPTION_SALT_KEYS in .env}

x-internal: &internal-only
    - analytics-internal

services:

    asyncmigrationscheck:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    browserless:
        logging: *bounded-logging
        networks: *internal-only
    capture:
        logging: *bounded-logging
        networks: *internal-only
    capture-ai:
        logging: *bounded-logging
        networks: *internal-only
    capture-logs:
        logging: *bounded-logging
        # PostHog's base file puts this service on `default` and `otel_network` too; replaced, not merged.
        networks: !override
            - analytics-internal
    clickhouse:
        logging: *bounded-logging
        environment:
            ERASE_CLICKHOUSE_PASSWORD: ${ERASE_CLICKHOUSE_PASSWORD:?Set ERASE_CLICKHOUSE_PASSWORD in .env}
            RETENTION_CLICKHOUSE_PASSWORD: ${RETENTION_CLICKHOUSE_PASSWORD:?Set RETENTION_CLICKHOUSE_PASSWORD in .env}
        # Added to PostHog's mounts (docker-compose.hobby.yml), which replace the image's config.xml and users.xml with
        # PostHog's own. Whether each NeurOne file still does what it says on that base is re-checked under OI-ANALYTICS-03 (4).
        volumes:
            - ./clickhouse/np-privacy.xml:/etc/clickhouse-server/config.d/np-privacy.xml:ro
            - ./clickhouse/np-erase-user.xml:/etc/clickhouse-server/users.d/np-erase-user.xml:ro
            - ./clickhouse/np-retention-user.xml:/etc/clickhouse-server/users.d/np-retention-user.xml:ro
        networks: *internal-only
    cyclotron-node-migrate:
        logging: *bounded-logging
        networks: *internal-only
    cymbal:
        logging: *bounded-logging
        networks: *internal-only
    cymbal-resolution:
        logging: *bounded-logging
        networks: *internal-only
    db:
        logging: *bounded-logging
        networks: *internal-only
    etcd:
        logging: *bounded-logging
        networks: *internal-only
    feature-flags:
        logging: *bounded-logging
        networks: *internal-only
    hypercache-server:
        logging: *bounded-logging
        networks: *internal-only
    ingestion-error-tracking:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    ingestion-general:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    ingestion-logs:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    ingestion-sessionreplay:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    ingestion-traces:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    kafka:
        logging: *bounded-logging
        networks: *internal-only
    kafka-init:
        logging: *bounded-logging
        networks: *internal-only
    livestream:
        logging: *bounded-logging
        networks: *internal-only
    objectstorage:
        logging: *bounded-logging
        ports: !reset []
        networks: *internal-only
    personhog-changelog-relay:
        logging: *bounded-logging
        networks: *internal-only
    personhog-etcd-init:
        logging: *bounded-logging
        networks: *internal-only
    personhog-identity:
        logging: *bounded-logging
        networks: *internal-only
    personhog-leader:
        logging: *bounded-logging
        networks: *internal-only
    personhog-publisher:
        logging: *bounded-logging
        networks: *internal-only
    personhog-replica:
        logging: *bounded-logging
        networks: *internal-only
    personhog-router:
        logging: *bounded-logging
        networks: *internal-only
    personhog-router-leader:
        logging: *bounded-logging
        networks: *internal-only
    personhog-tables-ready:
        logging: *bounded-logging
        networks: *internal-only
    personhog-writer:
        logging: *bounded-logging
        networks: *internal-only
    plugins:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    property-defs-ai:
        logging: *bounded-logging
        networks: *internal-only
    property-defs-rs:
        logging: *bounded-logging
        networks: *internal-only
    proxy:
        logging: *bounded-logging
        # PostHog leaves this image unversioned (`caddy`), so NeurOne names it. Its Caddyfile is PostHog's, written from an
        # environment variable; NeurOne's replaces it whole (caddy/Caddyfile).
        image: caddy:2.8-alpine
        restart: unless-stopped
        entrypoint: !reset null
        command: !override ["caddy", "run", "--config", "/etc/caddy/Caddyfile", "--adapter", "caddyfile"]
        environment: !override
            POSTHOG_HOST: ${POSTHOG_HOST:-localhost}
        ports: !override
            - "80:80"
            - "443:443"
            # Plain HTTP on this machine only: loopback, so no other device can skip TLS (OI-PRIV-50).
            - "127.0.0.1:${POSTHOG_PORT:-8000}:8000"
        volumes: !override
            - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
            - caddy-data:/data
            - caddy-config:/config
        depends_on: !override
            - web
            - capture
        networks: !override
            - analytics-internal
            - analytics-external
    recording-api:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    redis7:
        logging: *bounded-logging
        networks: *internal-only
    replay-capture:
        logging: *bounded-logging
        networks: *internal-only
    seaweedfs:
        logging: *bounded-logging
        ports: !reset []
        networks: *internal-only
    temporal:
        logging: *bounded-logging
        ports: !reset []
        networks: *internal-only
    temporal-admin-tools:
        logging: *bounded-logging
        networks: *internal-only
    temporal-django-worker:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    temporal-ui:
        logging: *bounded-logging
        ports: !reset []
        networks: *internal-only
    valkey:
        logging: *bounded-logging
        networks: *internal-only
    web:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    worker:
        logging: *bounded-logging
        environment: *posthog-env
        networks: *internal-only
    zookeeper:
        logging: *bounded-logging
        networks: *internal-only

    # ── Erasure relay ────────────────────────────────────────────────────────
    # Receives POST /np/erase {"distinct_id": …} from the app's AnalyticsErasureQueue (REQ-SW03-19). An ID the store holds no
    # events under is answered 200; one it does hold is queued on the erase_queue volume and answered 202, and a worker deletes
    # the queue in batches (OI-PRIV-48). Its ClickHouse user may delete from the events table and read its distinct_id column, and
    # nothing else (clickhouse/np-erase-user.xml). The queue holds pending IDs only; no address and no list of erased IDs is kept.
    # ORDER OF RELEASE: an app released before OI-PRIV-48's app half drops an ID on any 2xx, so do not run this relay where such
    # apps are in use (np_analytics_001 §7.6).
    # ClickHouse admits np_erase from this service's name only (clickhouse/np-erase-user.xml, OI-PRIV-50): keep the service called
    # erase-relay and on a network ClickHouse shares, or change that file in the same change (ci/test_posthog_infra.py P11).
    # It starts only after clickhouse_version_guard.py has read ClickHouse's version and found it at least 24.10 (§7.3).
    # The table name (ERASE_TABLES) is the old layout's until OI-ANALYTICS-03 (4) re-checks it on PostHog's current schema.
    # NOT yet exercised against a live stack: run `docker compose run --rm --use-aliases erase-relay python /app/erase_relay.py --self-check`
    # (np_analytics_001 §7.6, OI-ANALYTICS-01) before relying on it.
    erase-relay:
        logging: *bounded-logging
        image: python:3.12-alpine
        restart: unless-stopped
        depends_on:
            clickhouse:
                condition: service_healthy
        environment:
            CLICKHOUSE_URL: http://clickhouse:8123
            ERASE_CLICKHOUSE_USER: np_erase
            ERASE_CLICKHOUSE_PASSWORD: ${ERASE_CLICKHOUSE_PASSWORD:?Set ERASE_CLICKHOUSE_PASSWORD in .env}
            ERASE_TABLES: ${ERASE_TABLES:-posthog.sharded_events}
            ERASE_LISTEN: 0.0.0.0:8080
            ERASE_RATE_PER_SECOND: ${ERASE_RATE_PER_SECOND:-5}
            ERASE_BURST: ${ERASE_BURST:-20}
            # The pending IDs, on a volume so a restart loses none. The batch figures have no derivation (UC-210).
            ERASE_QUEUE_PATH: /var/lib/np-erase/queue
            ERASE_BATCH_SECONDS: ${ERASE_BATCH_SECONDS:-60}
            ERASE_BATCH_MAX: ${ERASE_BATCH_MAX:-500}
            ERASE_MUTATION_TIMEOUT_SECONDS: ${ERASE_MUTATION_TIMEOUT_SECONDS:-600}
        volumes:
            - ./erase_relay.py:/app/erase_relay.py:ro
            - ./clickhouse_version_guard.py:/app/clickhouse_version_guard.py:ro
            - erase_queue:/var/lib/np-erase
        command: ["sh", "-c", "python -I /app/clickhouse_version_guard.py && exec python -I /app/erase_relay.py"]
        networks: *internal-only

volumes:
    erase_queue:

networks:
    # Internal: service-to-service only. No route to the host's network or the internet.
    analytics-internal:
        internal: true
    # External: Caddy only, the stack's one entrance.
    analytics-external:
        driver: bridge
