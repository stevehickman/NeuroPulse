[package]
name = "neurone-fleet-gateway"
version = "0.1.0"
edition = "2021"
description = "The Oblivious HTTP gateway in front of the SHDR fleet ingest (NP-INFRA-001 §3.3b, OI-FLEET-01 (1))."
publish = false

[dependencies]
neurone-npps-core = { path = "../../../common/npps-core" }
serde_json = "1"

[dev-dependencies]
# An independent implementation (Mozilla's, with the RustCrypto-based `rust-hpke` backend), used only by tests/interop.rs to show
# that what the shared core seals another implementation opens, and the reverse (REQ-SHDR-07).
ohttp = { version = "0.7", default-features = false, features = ["client", "server", "rust-hpke"] }

# Its own workspace root: this is server infrastructure, built and shipped on its own, not a member of the apps' workspace.
[workspace]
