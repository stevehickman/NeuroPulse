# XcodeGen spec for the iOS host of the shared Compose Multiplatform app (app/NeurOneUI/shared).
#   xcodegen generate --spec app/NeurOneUI/iosApp/project.yml
# The Kotlin framework is built by Gradle in a pre-build phase; Xcode only links it.
name: NeurOneUI
options:
  bundleIdPrefix: life.neurone
  deploymentTarget:
    iOS: "17.0"
targets:
  NeurOneUI:
    type: application
    platform: iOS
    sources:
      - NeurOneUI
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.neurone.ui
        SWIFT_VERSION: "5.10"
        # Where `embedAndSignAppleFrameworkForXcode` puts NeurOneShared.framework.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework NeurOneShared"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../../android"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
