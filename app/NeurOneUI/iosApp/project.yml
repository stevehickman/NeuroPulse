# XcodeGen spec for the iOS host of the shared Compose Multiplatform app (app/NeurOneUI/shared).
#   xcodegen generate --spec app/NeurOneUI/iosApp/project.yml
# The Kotlin framework is built by Gradle in a pre-build phase; Xcode only links it.
name: NeurOneUI
options:
  bundleIdPrefix: life.neurone
  deploymentTarget:
    iOS: "17.0"
targets:
  NeurOneUI:
    type: application
    platform: iOS
    sources:
      - NeurOneUI
    info:
      path: Info.plist
      properties:
        # The Files app shows the app's Documents folder, where a backup is kept (SWR-MG-02).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Finding the other phone on the same Wi-Fi for a direct move asks for local-network access (SWR-MG-10).
        NSLocalNetworkUsageDescription: NeurOne finds your other phone on this Wi-Fi network to move your data to it.
        # The automatic backup asks iOS to wake the app now and then (BGProcessingTask, SWR-MG-03). The identifier is IosBackgroundBackup.kt's.
        BGTaskSchedulerPermittedIdentifiers: [life.neurone.ui.backup]
        UIBackgroundModes: [processing]
        # iPhone stays portrait. iPad turns every way, which is also what lets it run beside another app (an app limited to some
        # orientations must take the whole screen).
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # The analytics host (a bare host name) and the vendor's project token come from the build, not from source (REQ-SW03-20).
        # Set ANALYTICS_HOST and POSTHOG_PROJECT_TOKEN in a local .xcconfig or CI secret; unset or unexpanded means analytics is off.
        AnalyticsHost: $(ANALYTICS_HOST)
        PostHogProjectToken: $(POSTHOG_PROJECT_TOKEN)
    # No HealthKit: the app neither reads nor writes it (the HRV is the auricular clip's, read through the hub; REQ-HEALTH-01 is retired).
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        PRODUCT_BUNDLE_IDENTIFIER: life.neurone.ui
        SWIFT_VERSION: "5.10"
        # Where `embedAndSignAppleFrameworkForXcode` puts NeurOneShared.framework.
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS: "$(inherited) -framework NeurOneShared"
        ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../../android"
          ./gradlew :shared:embedAndSignAppleFrameworkForXcode
