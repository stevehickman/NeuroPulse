# NeuroPulse Android build configuration.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
kotlin.code.style=official

# AndroidX is required for the :app module (Jetpack Compose).
android.useAndroidX=true

# Local dev note: the Kotlin Gradle plugin requires a JDK it recognizes.
# CI and Android Studio provide their own JDK; on a bare machine, point
# org.gradle.java.home at a JDK 17 install if the default JVM is too new, e.g.:
#   org.gradle.java.home=/Library/Java/JavaVirtualMachines/temurin-17.jdk/Contents/Home
