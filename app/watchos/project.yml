name: NeuroPulseWatch

options:
  bundleIdPrefix: com.neuropulse
  deploymentTarget:
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    WATCHOS_DEPLOYMENT_TARGET: "10.0"
    SDKROOT: watchos
    TARGETED_DEVICE_FAMILY: "4"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

configs:
  Debug: debug
  Release: release

packages:
  NeuroPulseShared:
    path: ../NeuroPulseShared

targets:
  NeuroPulseWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"

    sources:
      - path: NeuroPulseWatch
        excludes:
          - "**/.DS_Store"
          - "**/*.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuropulse.watch
        INFOPLIST_FILE: NeuroPulseWatch/Info.plist

    dependencies:
      - package: NeuroPulseShared
