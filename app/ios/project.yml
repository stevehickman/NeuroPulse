# XcodeGen spec for the NeurOne iOS app — the single source of truth for the
# Xcode project. `NeurOne.xcodeproj` is GENERATED from this file and is NOT
# committed (Issue #189); the watchOS target has worked this way since PR #190.
#
# Bootstrap a checkout, from anywhere in the repository:
#
#     cd app/ios && xcodegen generate
#
# Never edit the generated project: the next regeneration discards the edit, and
# CI regenerates on every run. Everything the project should contain — sources,
# settings, packages, build phases, the shared scheme and its pre-action — is
# here.
name: NeurOne

options:
  bundleIdPrefix: life.neurone
  # Generate the locale files BEFORE XcodeGen reads the source tree.
  #
  # `NeurOne/Localizable.xcstrings` is generated from `locales/*.json` and
  # git-ignored (CLAUDE.md §17), and XcodeGen builds the project from what is on
  # disk when it runs. Generate the project against a checkout where the
  # catalogue does not exist yet and TWO things are silently lost: the Resources
  # entry — so every `String(localized:)` renders its raw key, the failure PR
  # #319 already hit once — and `knownRegions`, which XcodeGen reads out of the
  # catalogue itself, collapsing eleven locales to `en` + `Base`. Neither fails
  # the build. `optional: true` on an explicit source entry does not help:
  # XcodeGen creates no file reference for an optional path that is missing.
  #
  # This runs the same generator `ios-ci.yml` runs as an explicit step, so the
  # ordering holds for a developer running `xcodegen generate` by hand too.
  preGenCommand: |
    set -eu
    export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
    if ! command -v bun >/dev/null 2>&1; then
      echo "error: bun not found. NeurOne/Localizable.xcstrings is generated from locales/*.json;" >&2
      echo "note: install bun (https://bun.sh), then re-run xcodegen generate." >&2
      exit 1
    fi
    bun "$(git rev-parse --show-toplevel)/scripts/sync-locales.ts"
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                    # fill in with Apple Team ID before signing
    # PostHog analytics token — set via local .xcconfig or CI secret.
    # Never commit the real token to source. See PostHogAnalyticsBackend.swift.
    POSTHOG_PROJECT_TOKEN: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

configs:
  Debug: debug
  Release: release

targets:
  NeurOne:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: NeurOne
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "Info.plist"
      - path: SupportingFiles
        type: folder
        excludes:
          - "NeurOne.entitlements"
      # The .npps protocol library, copied into the bundle as a folder
      # reference and read at runtime by NPBundledProtocols (PR #285) —
      # `predefined/manifest.json` and every file it lists. It was added to the
      # committed .pbxproj by hand and never to this spec, so until Issue #189
      # regenerating the project silently dropped it: the app would have shipped
      # with no protocol library and NPProtocolLibraryTests would have failed on
      # a missing manifest.
      - path: ../../protocols/predefined
        type: folder

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.neurone.app
        INFOPLIST_FILE: SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/NeurOne.entitlements

    dependencies:
      - package: NeurOneShared
      - package: PostHog
        product: PostHog

    # Keeps the generated Localizable.xcstrings fresh once it exists — for a
    # canonical edit made during an open Xcode session, this is what picks it up.
    #
    # It is NOT what makes the first build work, and cannot be. Xcode computes
    # the build plan before any phase runs, so a git-ignored catalogue that does
    # not yet exist is simply not in the plan and never gets compiled into the
    # bundle — the phase then writes a file nothing reads, and every
    # String(localized:) renders its raw key. That is exactly what happened on
    # the first CI run of this arrangement: the phase logged "11 locales, 1420
    # keys" and eight tests still failed on unrendered keys. Creating the file
    # ahead of the plan is the scheme build pre-action's job (see schemes: below,
    # and the explicit step in ios-ci.yml). Both are kept: the pre-action for a
    # clean build, this phase for freshness within a session.
    #
    # Since Issue #189 the project is generated from this spec on every build
    # and in CI, so this entry is the only place the phase exists.
    #
    # basedOnDependencyAnalysis: false because the inputs are 11 JSON files
    # outside SRCROOT; the generator only rewrites files whose content actually
    # changed, so an unconditional run still leaves a no-op build no-op.
    preBuildScripts:
      - name: "Generate localized strings"
        basedOnDependencyAnalysis: false
        script: |
          set -eu

          # Xcode build phases do not inherit a login shell PATH, so bun is
          # looked for where the installers put it before falling back.
          export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          if ! command -v bun >/dev/null 2>&1; then
            echo "error: bun not found. Localizable.xcstrings is generated from locales/*.json;"
            echo "note: install bun (https://bun.sh), or run \"bun scripts/sync-locales.ts\" from the repository root."
            exit 1
          fi

          cd "${SRCROOT}/../.."
          bun scripts/sync-locales.ts

  NeurOneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: NeurOneTests
        excludes:
          - "**/.DS_Store"
          - "**/*.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.neurone.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NeurOne.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NeurOne"

    dependencies:
      - target: NeurOne

packages:
  NeurOneShared:
    path: ../NeurOneShared
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.60.0"

schemes:
  NeurOne:
    build:
      # Runs BEFORE Xcode computes the build plan, which is the only point at
      # which a git-ignored generated resource can still enter it. XcodeGen
      # writes it into the generated
      # NeurOne.xcodeproj/xcshareddata/xcschemes/NeurOne.xcscheme, which is the
      # file xcodebuild actually reads; since Issue #189 that scheme is no
      # longer committed, so this entry is its only source.
      preActions:
        - name: "Generate localized strings"
          settingsTarget: NeurOne
          script: |
            set -eu
            export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
            if ! command -v bun >/dev/null 2>&1; then
              echo "error: bun not found. Run 'bun scripts/sync-locales.ts' from the repository root."
              exit 1
            fi
            cd "${SRCROOT}/../.."
            bun scripts/sync-locales.ts
      targets:
        NeurOne: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeurOneTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

    # No preBuildScripts here: `preBuildScripts` is a TARGET key, and XcodeGen
    # ignores it under a scheme. A non-blocking SwiftLint phase was written here
    # and never reached any project — the committed .pbxproj had no such phase
    # either — so it is removed rather than carried into the file that is now
    # the only source of truth. Linting is a CI job (`swiftlint --strict` in
    # ios-ci.yml); to get it in-editor as well, move the entry to the NeurOne
    # target's `preBuildScripts` above.
