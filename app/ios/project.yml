name: NeurOne

options:
  bundleIdPrefix: life.neurone
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                    # fill in with Apple Team ID before signing
    # PostHog analytics token — set via local .xcconfig or CI secret.
    # Never commit the real token to source. See PostHogAnalyticsBackend.swift.
    POSTHOG_PROJECT_TOKEN: ""
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

configs:
  Debug: debug
  Release: release

targets:
  NeurOne:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: NeurOne
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "Info.plist"
      - path: SupportingFiles
        type: folder
        excludes:
          - "NeurOne.entitlements"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.neurone.app
        INFOPLIST_FILE: SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/NeurOne.entitlements

    dependencies:
      - package: NeurOneShared
      - package: PostHog
        product: PostHog

    # Keeps the generated Localizable.xcstrings fresh once it exists — for a
    # canonical edit made during an open Xcode session, this is what picks it up.
    #
    # It is NOT what makes the first build work, and cannot be. Xcode computes
    # the build plan before any phase runs, so a git-ignored catalogue that does
    # not yet exist is simply not in the plan and never gets compiled into the
    # bundle — the phase then writes a file nothing reads, and every
    # String(localized:) renders its raw key. That is exactly what happened on
    # the first CI run of this arrangement: the phase logged "11 locales, 1420
    # keys" and eight tests still failed on unrendered keys. Creating the file
    # ahead of the plan is the scheme build pre-action's job (see schemes: below,
    # and the explicit step in ios-ci.yml). Both are kept: the pre-action for a
    # clean build, this phase for freshness within a session.
    #
    # Kept in the spec as well as in the committed .xcodeproj so regenerating the
    # project with XcodeGen does not drop it.
    #
    # basedOnDependencyAnalysis: false because the inputs are 11 JSON files
    # outside SRCROOT; the generator only rewrites files whose content actually
    # changed, so an unconditional run still leaves a no-op build no-op.
    preBuildScripts:
      - name: "Generate localized strings"
        basedOnDependencyAnalysis: false
        script: |
          set -eu

          # Xcode build phases do not inherit a login shell PATH, so bun is
          # looked for where the installers put it before falling back.
          export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"

          if ! command -v bun >/dev/null 2>&1; then
            echo "error: bun not found. Localizable.xcstrings is generated from locales/*.json;"
            echo "note: install bun (https://bun.sh), or run \"bun scripts/sync-locales.ts\" from the repository root."
            exit 1
          fi

          cd "${SRCROOT}/../.."
          bun scripts/sync-locales.ts

  NeurOneTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: NeurOneTests
        excludes:
          - "**/.DS_Store"
          - "**/*.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: life.neurone.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NeurOne.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NeurOne"

    dependencies:
      - target: NeurOne

packages:
  NeurOneShared:
    path: ../NeurOneShared
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    from: "3.60.0"

schemes:
  NeurOne:
    build:
      # Runs BEFORE Xcode computes the build plan, which is the only point at
      # which a git-ignored generated resource can still enter it. Mirrors the
      # PreActions block in the committed
      # NeurOne.xcodeproj/xcshareddata/xcschemes/NeurOne.xcscheme — that file is
      # what xcodebuild actually reads; this entry keeps an XcodeGen
      # regeneration from dropping it.
      preActions:
        - name: "Generate localized strings"
          settingsTarget: NeurOne
          script: |
            set -eu
            export PATH="$HOME/.bun/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
            if ! command -v bun >/dev/null 2>&1; then
              echo "error: bun not found. Run 'bun scripts/sync-locales.ts' from the repository root."
              exit 1
            fi
            cd "${SRCROOT}/../.."
            bun scripts/sync-locales.ts
      targets:
        NeurOne: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeurOneTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

    preBuildScripts:
      - name: "Lint — SwiftLint (warning only, non-blocking)"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml" --reporter xcode 2>/dev/null || true
          fi
        showEnvVars: false
        basedOnDependencyAnalysis: false
