name: NeuroPulse

options:
  bundleIdPrefix: com.neuropulse
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                    # fill in with Apple Team ID before signing
    CODE_SIGN_STYLE: Automatic
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SDKROOT: iphoneos
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    TARGETED_DEVICE_FAMILY: "1,2"
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"

configs:
  Debug: debug
  Release: release

targets:
  NeuroPulse:
    type: application
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: NeuroPulse
        excludes:
          - "**/.DS_Store"
          - "**/*.md"
          - "Info.plist"
      - path: SupportingFiles
        type: folder
        excludes:
          - "NeuroPulse.entitlements"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuropulse.app
        INFOPLIST_FILE: SupportingFiles/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: SupportingFiles/NeuroPulse.entitlements

    dependencies:
      - package: NeuroPulseShared

  NeuroPulseTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"

    sources:
      - path: NeuroPulseTests
        excludes:
          - "**/.DS_Store"
          - "**/*.md"

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.neuropulse.tests
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/NeuroPulse.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NeuroPulse"

    dependencies:
      - target: NeuroPulse

packages:
  NeuroPulseShared:
    path: ../NeuroPulseShared

schemes:
  NeuroPulse:
    build:
      targets:
        NeuroPulse: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - NeuroPulseTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

    preBuildScripts:
      - name: "Lint — SwiftLint (warning only, non-blocking)"
        script: |
          if which swiftlint > /dev/null; then
            swiftlint --config "${SRCROOT}/.swiftlint.yml" --reporter xcode 2>/dev/null || true
          fi
        showEnvVars: false
        basedOnDependencyAnalysis: false
