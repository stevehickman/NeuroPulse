# SwiftLint configuration for the NeuroPulse iOS app.
#
# Satisfies ISA criteria:
#   ISC-3 — `swiftlint --strict` runs with zero violations on the source tree.
#   ISC-8 — No `print()` calls in release-target Swift source (use `Logger` from `os`).
#   ISC-9 — No hardcoded IP addresses, URLs, or API keys in Swift source.
#
# CI runs `swiftlint --strict` from the `app/ios/` directory. With --strict,
# every warning is treated as an error, so any violation fails the build.
#
# SwiftLint 0.54+ YAML format. No build phase is registered — lint is CI-only.

# Only lint the app source tree. Build artefacts, the Xcode project bundle, and
# any vendored dependencies are excluded.
included:
  - NeuroPulse

excluded:
  - NeuroPulse.xcodeproj
  - build
  - Pods

reporter: "xcode"

# ---------------------------------------------------------------------------
# Standard rules
# ---------------------------------------------------------------------------
force_cast: warning
force_try: warning
trailing_whitespace:
  severity: warning
vertical_whitespace:
  severity: warning

line_length:
  warning: 140
  error: 200
  ignores_urls: true
  ignores_comments: false

# ---------------------------------------------------------------------------
# Custom rules
# ---------------------------------------------------------------------------
# `no_print_statement` is implemented here as a custom rule because SwiftLint
# 0.54 does not ship a built-in opt-in rule of that name. Banning `print` keeps
# the codebase on `Logger` from the `os` framework (ISC-8). The regex matches a
# `print(` call only when it is not preceded by `.` (so `someObject.print(...)`
# member calls and `debugPrint`/`fatalError` are not falsely flagged).
custom_rules:
  no_print_statement:
    name: "No print() statements"
    message: "Use `Logger` from the `os` framework instead of print(). See ISA ISC-8."
    regex: '(?<![\.\w])print\s*\('
    match_kinds:
      - identifier
    severity: warning

  # ISC-93 / NP-APP-TELEMETRY-001 Rev B §3: raw session counts must never be
  # transmitted in analytics. Catch `"session_count"` / `"session_sequence"`
  # used as analytics dictionary keys. Scoped to a `key: value` dictionary-entry
  # shape (string literal immediately followed by a colon) so that prose,
  # comments, and non-key occurrences are not flagged. `engagement_tier` is the
  # only permitted bucket.
  no_session_count_analytics:
    name: "No raw session count in analytics"
    message: "Raw session_count/session_sequence must not be an analytics key. Use the engagement_tier enum. See ISA ISC-93 / NP-APP-TELEMETRY-001 Rev B §3."
    regex: '"(session_count|session_sequence)"\s*:'
    match_kinds:
      - string
    severity: warning

  # ISC-97 / NP-APP-TELEMETRY-001 Rev B: these biometric / identifier strings
  # must never appear as analytics event property keys. Scoped to the
  # dictionary-key shape (`"<key>":`) so that UI labels, search tags, and
  # WatchConnectivity message keys are not flagged — only string literals used
  # as keys in event property dictionaries.
  no_analytics_keys:
    name: "No prohibited analytics property keys"
    message: "eeg/hrv/rmssd/coherence/session_id/protocol_id must not be analytics event property keys. See ISA ISC-97 / NP-APP-TELEMETRY-001 Rev B."
    regex: '"(eeg|hrv|rmssd|coherence|session_id|protocol_id)"\s*:'
    match_kinds:
      - string
    severity: warning

  # ISC-93 / ISC-144: session_count/session_sequence must never appear as a key.
  # Broader than no_session_count_analytics — covers subscript access too.
  no_session_count_key:
    name: "No session_count/session_sequence key"
    message: "Use engagement_tier enum. See ISA ISC-93/ISC-144 / NP-APP-TELEMETRY-001 Rev B §3."
    regex: '"(session_count|session_sequence)"\s*[:\)\]]'
    match_kinds:
      - string
    severity: warning

  # ---------------------------------------------------------------------------
  # ISC-9 — No hardcoded IP addresses, API keys, or bearer credentials.
  #
  # SCOPE DECISION: domain-name URL constants are intentionally EXCLUDED from
  # these rules. NeuroPulse's production endpoint hostnames (fleet.neuropulse.internal,
  # firmware.neuropulse.ai, neuropulse.com, eu.i.posthog.com) are legitimate named
  # constants, not secrets, and are documented with infrastructure setup guidance in
  # each Swift file. What we DO prohibit:
  #
  #   • Raw IPv4 addresses in string literals — use a hostname, never an IP.
  #   • Hardcoded API keys / project tokens / access tokens / bearer credentials
  #     passed as string literals. Use Info.plist (sourced from build variable) or
  #     Keychain; never embed the credential itself in source.
  #   • PEM-formatted private key material (BEGIN PRIVATE KEY blocks) in any string.
  #
  # The ISA ISC-9 grep verifier (`grep -rEn '([0-9]{1,3}\.){3}[0-9]{1,3}'`) checks
  # raw IPs across all source; these SwiftLint rules enforce the same constraint in CI
  # and extend coverage to key/token patterns.
  # ---------------------------------------------------------------------------

  no_raw_ip_address:
    name: "No hardcoded IPv4 address in string literal"
    message: "Use a hostname constant, not a raw IP. Domain-name endpoint constants are fine. See ISA ISC-9."
    # Matches the dotted-decimal IPv4 pattern inside any string token. match_kinds:string
    # ensures this fires only on string literals, not on hex byte arrays, comments, or code.
    regex: '\b(\d{1,3}\.){3}\d{1,3}\b'
    match_kinds:
      - string
    severity: warning

  no_hardcoded_secret:
    name: "No hardcoded API key, token, or bearer credential"
    message: "Use Info.plist (sourced from build variable) or Keychain — never hardcode secrets in source. See ISA ISC-9."
    # Matches patterns of the form: <key-name> <separator> "<value of 16+ chars>".
    # Key-name alternatives cover common conventions (snake_case, kebab-case, camelCase).
    # This deliberately does NOT flag domain-name strings or PostHog host constants —
    # those are not credentials. It WOULD flag: api_key = "sk-proj-…", projectToken: "phc_…".
    regex: '(?i)(api[-_]?key|secret[-_]?key|project[-_]?token|access[-_]?token|auth[-_]?token|bearer)\s*[=:(,]\s*"[A-Za-z0-9+/=._\-]{16,}"'
    severity: error

  no_private_key_literal:
    name: "No PEM private key material in source"
    message: "Private key material must never appear in source. Use Keychain or Secure Enclave. See ISA ISC-9."
    regex: '-----BEGIN\s+(RSA\s+|EC\s+|DSA\s+|OPENSSH\s+)?PRIVATE\s+KEY-----'
    match_kinds:
      - string
    severity: error
