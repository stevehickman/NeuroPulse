name: SHDR Schema CI Gate (OI-EMMC2-07)

# NP-FW-EMMC-002 Rev 1 §G.5
# BLOCKING for SHDR fleet DB schema freeze.
# Confirms no prohibited accelerometer columns, no PII columns,
# no cross-DB references, and warranty_token is opaque BYTEA.

on:
  # Push only validates the default branch after a merge. A PR branch is covered by
  # pull_request, so it no longer triggers two runs of the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This gate only checks out the repo and runs the schema tests;
# nothing reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same PR. Only pull_request
# runs are cancelled: a run on the default branch is never cancelled by a later merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Per-commit relevance (NP-SW-CI-001 §6.7). Replaces the `pull_request: paths:`
  # filter, which GitHub evaluates against the WHOLE pull request: once a PR touched
  # one of these paths, every later commit re-ran this workflow, however small. This
  # job diffs from the last green run of this workflow on the branch instead, so a
  # commit that cannot affect the build skips it. A job skipped by `if:` reports
  # `skipped`, which satisfies a required check; a `paths:`-suppressed workflow
  # never reports at all.
  changes:
    name: Relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      NP_SCOPE_PATHS: |
        ci/shdr/shdr_fleet_schema.sql
        ci/shdr/shdr_schema_constraint_tests.sql
        ci/test_shdr_schema.py
        ci/test_shdr_schema_selftest.py
        ci/test_shdr_char_gate_selftest.py
        ci/run_shdr_constraint_tests.sh
        # CHAR-01 reads the firmware constants out of this header and requires the
        # schema to agree with them, so a change to it can flip the gate's verdict
        # without touching a single file above.
        firmware/shdr/include/np_accel_shdr.h
        .github/workflows/shdr-schema-ci.yml
        .github/toolchain.json
        .github/actions/setup-toolchain/**
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Changed files
        id: diff
        env:
          NP_EVENT: ${{ github.event_name }}
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NP_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          NP_REPO: ${{ github.repository }}
          NP_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          NP_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! merge_base=$(scripts/ci-changed-scope.sh --diff-base \
                 "$NP_EVENT" "${NP_BASE:-}" "$NP_HEAD" "$NP_DEFAULT_BRANCH" "$NP_REF") \
             || [ -z "$merge_base" ]; then
            echo "::notice::no usable base revision (event=$NP_EVENT, ref=$NP_REF, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(scripts/ci-changed-scope.sh --resolve-base shdr-schema-ci.yml "$merge_base" \
                   "$NP_EVENT" "$NP_HEAD" "$NP_HEAD_BRANCH" "$NP_DEFAULT_BRANCH" "$NP_HEAD_REPO" "$NP_REPO")
          git diff --name-only "${base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  shdr-schema-gate:
    name: SHDR Schema Privacy Gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}

    # A real PostgreSQL for the live constraint tests. A service container is
    # used rather than the runner's own packages because initdb/pg_ctl are not
    # on PATH on ubuntu-latest (they live under /usr/lib/postgresql/<v>/bin),
    # so the harness's throwaway-cluster path would not start. It falls back to
    # DATABASE_URL, which is what this provides.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: np
          POSTGRES_PASSWORD: np
          POSTGRES_DB: shdr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U np -d shdr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: ./.github/actions/setup-toolchain
        with:
          python: 'true'

      - name: Run OI-EMMC2-07 schema CI test
        run: python3 ci/test_shdr_schema.py --verbose --schema ci/shdr/shdr_fleet_schema.sql

      - name: Self-test the accelerometer assertion (test-of-the-test)
        run: python3 ci/test_shdr_schema_selftest.py

      # CHAR-01 GRANTS a permission rather than withholding one, which makes it
      # the more dangerous of the two gates and the one needing more
      # falsification. This suite constructs the broken worlds and confirms each
      # is rejected: a schema that would admit a non-consented row, a closed
      # window whose table is still present, a renamed firmware constant, and —
      # the property the design turns on — that the ACCEL-01/ACCEL-02 exemption
      # WITHDRAWS whenever CHAR-01 fails for any reason.
      - name: Falsify the CHAR-01 characterisation-window exception
        run: python3 ci/test_shdr_char_gate_selftest.py

      # The Python gate above is a static analyser over the DDL text. It cannot
      # tell whether the file is valid SQL, nor whether a CHECK actually fires:
      # a constraint with a typo'd predicate parses fine and passes every
      # name-and-type check while silently admitting the rows it was written to
      # block. The step below makes PostgreSQL itself the judge — it loads the
      # schema for real and then proves each constraint rejects what it exists
      # to reject (33 reject-cases, 23 accept-cases so a uniformly hostile
      # constraint cannot pass by refusing everything).
      - name: Execute schema + live constraint tests (real PostgreSQL)
        env:
          DATABASE_URL: postgres://np:np@127.0.0.1:5432/shdr_test
        run: ci/run_shdr_constraint_tests.sh

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shdr-schema-violations
          path: ci/shdr/
          retention-days: 30
