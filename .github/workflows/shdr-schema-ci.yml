name: SHDR Schema CI Gate (OI-EMMC2-07)

# NP-FW-EMMC-002 Rev 1 §G.5
# BLOCKING for SHDR fleet DB schema freeze.
# Confirms no prohibited accelerometer columns, no PII columns,
# no cross-DB references, and warranty_token is opaque BYTEA.

on:
  push:
    paths:
      - 'ci/shdr/shdr_fleet_schema.sql'
      - 'ci/shdr/shdr_schema_constraint_tests.sql'
      - 'ci/test_shdr_schema.py'
      - 'ci/test_shdr_schema_selftest.py'
      - 'ci/test_shdr_char_gate_selftest.py'
      - 'ci/run_shdr_constraint_tests.sh'
      # CHAR-01 reads the firmware constants out of this header and requires the
      # schema to agree with them, so a change to it can flip the gate's verdict
      # without touching a single file above.
      - 'firmware/shdr/include/np_accel_shdr.h'
      - '.github/workflows/shdr-schema-ci.yml'
  pull_request:
    paths:
      - 'ci/shdr/shdr_fleet_schema.sql'
      - 'ci/shdr/shdr_schema_constraint_tests.sql'
      - 'ci/test_shdr_schema.py'
      - 'ci/test_shdr_schema_selftest.py'
      - 'ci/test_shdr_char_gate_selftest.py'
      - 'ci/run_shdr_constraint_tests.sh'
      # CHAR-01 reads the firmware constants out of this header and requires the
      # schema to agree with them, so a change to it can flip the gate's verdict
      # without touching a single file above.
      - 'firmware/shdr/include/np_accel_shdr.h'
      - '.github/workflows/shdr-schema-ci.yml'
  workflow_dispatch:

# Least privilege. This gate only checks out the repo and runs the schema tests;
# nothing reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

jobs:
  shdr-schema-gate:
    name: SHDR Schema Privacy Gate
    runs-on: ubuntu-latest

    # A real PostgreSQL for the live constraint tests. A service container is
    # used rather than the runner's own packages because initdb/pg_ctl are not
    # on PATH on ubuntu-latest (they live under /usr/lib/postgresql/<v>/bin),
    # so the harness's throwaway-cluster path would not start. It falls back to
    # DATABASE_URL, which is what this provides.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: np
          POSTGRES_PASSWORD: np
          POSTGRES_DB: shdr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U np -d shdr_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run OI-EMMC2-07 schema CI test
        run: python3 ci/test_shdr_schema.py --verbose --schema ci/shdr/shdr_fleet_schema.sql

      - name: Self-test the accelerometer assertion (test-of-the-test)
        run: python3 ci/test_shdr_schema_selftest.py

      # CHAR-01 GRANTS a permission rather than withholding one, which makes it
      # the more dangerous of the two gates and the one needing more
      # falsification. This suite constructs the broken worlds and confirms each
      # is rejected: a schema that would admit a non-consented row, a closed
      # window whose table is still present, a renamed firmware constant, and —
      # the property the design turns on — that the ACCEL-01/ACCEL-02 exemption
      # WITHDRAWS whenever CHAR-01 fails for any reason.
      - name: Falsify the CHAR-01 characterisation-window exception
        run: python3 ci/test_shdr_char_gate_selftest.py

      # The Python gate above is a static analyser over the DDL text. It cannot
      # tell whether the file is valid SQL, nor whether a CHECK actually fires:
      # a constraint with a typo'd predicate parses fine and passes every
      # name-and-type check while silently admitting the rows it was written to
      # block. The step below makes PostgreSQL itself the judge — it loads the
      # schema for real and then proves each constraint rejects what it exists
      # to reject (33 reject-cases, 23 accept-cases so a uniformly hostile
      # constraint cannot pass by refusing everything).
      - name: Execute schema + live constraint tests (real PostgreSQL)
        env:
          DATABASE_URL: postgres://np:np@127.0.0.1:5432/shdr_test
        run: ci/run_shdr_constraint_tests.sh

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shdr-schema-violations
          path: ci/shdr/
          retention-days: 30
