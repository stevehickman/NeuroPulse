name: Firmware Cross-Compile (ARM)

# SW-02 Class B — i.MX RT1062 main processor firmware and the dual-bank OTA
# bootloader, plus the 25 Class B host-test targets: the 19 absorbed from the
# retired firmware-host-tests.yml (NP-SW-CI-001 §5.0.1, OI-SWCI-09), one added
# by NP-SW-CI-001 phase 1, one by phase 2, one by OI-HUB-C06, one by phase 8
# (np_app_link_agreement_tests) and one by phase 9
# (np_bootloader_flexram_tests).
#
# Self-contained by construction: native host tests THEN the cross-compile, in
# one file, because `needs:` only works within a single workflow.  Crossing
# workflow boundaries would mean `workflow_run`, which only fires on the default
# branch, runs in base-repo context, and does not attach cleanly to a pull
# request's check list — fragile in exactly the situation the gate exists for.
#
# ── Host-test targets owned by this workflow (25 of the repo's 32) ────────────
# Registered by the NP_BUILD_TESTS branch of firmware/CMakeLists.txt:
#   firmware/bootloader      → np_bootloader_mem_tests (freestanding memcpy/
#                              memset, NP-SW-CI-001 §4.2 — see the note below)
#                            → np_bootloader_app_image_tests (OCRAM staging
#                              limit + linker-script agreement, §4.3)
#                            → np_bootloader_flexram_tests (FlexRAM bank-config
#                              and TCM window encodings, §4.10)
#   firmware/crypto          → np_crypto_tests   (SHA-256/512, CRC-32, Ed25519)
#   firmware/anon            → np_anon_tests     (Scratch encryption)
#   firmware/edf             → np_edf_tests      (EDF+ privacy header)
#   firmware/factory_reset   → np_factory_reset_tests (device reset)
#   firmware/uhdr_key        → np_uhdr_key_tests (two-layer UHDR key, §C)
#   firmware/shdr            → np_accel_shdr_tests (SHDR accelerometer: the §G
#                              standing rule and the §H characterisation window)
#   firmware/ota             → np_ota_tests      (OTA state CRC + rollback)
#   firmware/hub_control     → np_cvns_reenable_tests (OI-CVNS-HUB-01)
#                            → np_log_backend_tests   (OI-LOG-01..04)
#                            → np_transport_tests     (OI-HUB-MAIN-01)
#                            → np_mod_cvns_tests      (hub ↔ CVNS library)
#                            → np_module_map_tests    (hex zone-module addressing/NVRAM map)
#                            → np_protocol_tests      (hub protocol v2 socket-mask targets)
#                            → np_mod_stim_tests      (BES/tACS + tDCS slot dispatch)
#                            → np_pbm_cal_bridge_tests (OI-HUB-C06: np_module_map's
#                              UID-keyed calibration reaching a pbm session)
#   firmware/zone_announce   → np_zone_announce_tests (module-status frame encoder)
#                            → np_zone_notify_tests   (app-notify dispatch)
#   firmware/pbm      → np_pbm_session_desc_tests (NP-SES-1064-001 v5 wire format
#                              + OI-HUB-C06 UID-keyed calibration load)
#   firmware/cervical_vns    → np_cvns_fai_tests      (FAI CV01..CV06, cardiac interlock)
#   firmware/sloreta_hdtdcs  → np_hd_fai_tests        (FAI HD02/HD05.., montage + sLORETA)
#   firmware/vendor/freertos → np_freertos_smoke_tests (kernel + config, POSIX port)
#
# The other 7 (firmware/safety_mcu) belong to safety-mcu-ci.yml.  7 + 25 = 32,
# disjoint; build-all.yml re-checks that partition weekly.  (This line read
# "7 + 23 = 30" until phase 9.  It was stale from phase 8, which added a target
# and updated NP_CLASS_B_TEST_COUNT here but not build-all.yml's
# NP_TOTAL_TEST_COUNT — so the weekly backstop's partition assertion had been
# failing on the real total of 31 ever since.  OI-SWCI-37's shape, found by
# counting rather than by CI, because nothing surfaces a red build-all:
# OI-SWCI-10.)
#
# ── Partial host-test coverage, and why it is partial ─────────────────────────
# firmware/bootloader has THREE host test targets: np_bootloader_mem_tests
# (phase 1, covering src/np_mem.c — the freestanding memcpy/memset the
# bootloader must supply for itself under -nostdlib), np_bootloader_app_image_tests
# (phase 2, covering src/np_app_image.c — the OCRAM staging ceiling, checked
# against the reservation parsed out of the linker script itself) and
# np_bootloader_flexram_tests (phase 9, covering the pure half of
# src/np_flexram.c — the GPR17 bank-config packing and the GPR14 TCM window
# codes; the register stores themselves are compiled out on a host, for the
# same reason np_app_image.c's linker-symbol readers are).  The remaining
# bootloader sources stay cross-compile-only on
# purpose: they are device firmware (eMMC transport, USB DFU, vector-table
# handoff) with no host-executable surface, so a host job could not run them
# and a green check would prove nothing about the code that changed.  Honest
# silence beats a vacuous pass.
#
# firmware/hrv_biofeedback still has NO host test target at all, and that too
# is deliberate rather than drift — see OI-SWCI-05, which records whether it
# warrants one as an open question, not a defect in this file.
#
# Read the NP_BUILD_TESTS branch of firmware/CMakeLists.txt literally: it ends
# in return(), so every add_subdirectory() below that point is cross-compile-
# only.  bootloader/ now appears in BOTH places — inside the branch, where its
# CMakeLists builds only the test target, and below it, where the same file
# builds the ELF and needs arm-none-eabi-objcopy/-size.  An audit that greps
# add_subdirectory() calls without reading which side of the return() they fall
# on will misreport this; that is what this note is for, because one did.
#
# ── Scoping: why there is no `paths:` filter here any more ────────────────────
# NP-SW-CI-001 §5.0 still governs: this workflow builds and tests only the
# modules it actually compiles, NOT `firmware/**`.  What changed at phase 6
# (§6.7) is WHERE that decision is made, and only that.
#
# A workflow-level `paths:` filter suppresses the whole workflow, so on a
# docs-only PR these checks never report at all.  A required status check that
# never reports renders as "Expected — waiting for status" and blocks the pull
# request forever — it is treated as pending, not as passing.  So `paths:` and
# "required check" are mutually exclusive, and phase 6 needs both.
#
# The relevance list therefore moved from `on: … paths:` into the `changes` job
# below, which computes the changed-file set with `git diff` and exposes a
# boolean the other jobs gate on with `if:`.  The workflow now always triggers,
# every check always reports, and out-of-scope jobs report `skipped` — which
# DOES satisfy a required check.  Nothing irrelevant is compiled or tested; the
# build surface is unchanged and only the reporting surface moved.
#
# Two consequences worth stating:
#
#   * There is now ONE list instead of two.  The old `push:` and `pull_request:`
#     blocks had to be kept identical by hand because the Actions parser does
#     not support YAML anchors, and this header used to carry a "edit BOTH
#     lists" warning.  That hazard is gone rather than relocated.
#   * Every push and every PR now starts the `changes` job (~20s) even when
#     nothing relevant changed.  That is the price of the checks being
#     requirable, and it is paid in the cheapest job in the file.
#
# firmware/safety_mcu/** is still deliberately ABSENT from the list: it is a
# separate CMake project with its own toolchain file and its own workflow, and
# it is not a dependency of the bootloader or the main firmware.  A change
# confined to the safety MCU must not rebuild either.  Dependencies count;
# proximity in the tree does not.  That reasoning is now also ASSERTED rather
# than merely stated — see the "Scope assertions" step in the `changes` job,
# which fails the job if a safety-MCU-only change is ever judged in scope here.
#
# The list is still hand-maintained and will still drift from the build graph.
# build-all.yml is the backstop that makes the drift survivable; OI-SWCI-08 is
# the guard that would make it self-detecting.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege.  Required for actions/checkout, which hard-fails without it
# once the repository is private.  Matches every other workflow in the repo.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

env:
  # The 7 Class C targets, EXCLUDED here — they run in safety-mcu-ci.yml.
  # Kept as the same regex string in both files so the partition is one
  # expression, negated on one side.
  #
  # ⚠ THIS STRING EXISTS IN THREE FILES — here, safety-mcu-ci.yml and
  # build-all.yml — and nothing verifies they agree.  That is the one-value-
  # several-places shape NP-SW-CI-001 calls Defect C, and it bit during phase 7:
  # `hal_platform` was added to the other two copies and missed here, so the new
  # Class C target was not excluded and this leg selected 22 against an expected
  # 21.  The partition guard caught it (`ctest selection drift — expected 21
  # Class B targets, matched 22`), which is exactly what it is for — but the
  # guard fires on the SYMPTOM, one CI round-trip later, and only because the
  # counts happen to be asserted. Raised as OI-SWCI-37: hoist this to one
  # source, or add a guard that diffs the three copies directly.
  NP_SAFETY_TESTS: '^np_(safety_spi_proto|charge_monitor|thermal_interlock|impedance_report|fault_latch_privacy|cardiac_interlock|hal_platform)_tests$'
  # The count the selection must match.  It lives here and in the assertion step
  # below — and NOT in the `host-tests` job `name:`, which is what a required
  # status check matches on.  The job used to be called "CMake host tests (21
  # Class B targets)"; that count has already moved five times
  # (19 → 20 → 21 → 22 → 23 → 24 → 25, the last two by phase 8's
  #  np_app_link_agreement_tests and phase 9's np_bootloader_flexram_tests)
  # as phases added targets, and a required context is an exact string match, so
  # the next phase that adds a target would have renamed the check and silently
  # stopped satisfying the requirement — a merge deadlock with no error message
  # anywhere.  The number belongs to the assertion, not to the check name.
  # NP-SW-CI-001 §6.7.
  NP_CLASS_B_TEST_COUNT: '25'

jobs:
  # The relevance list that used to live in `on: … paths:`.  This job always
  # runs and always reports, which is the whole point (§6.7).
  changes:
    name: Class B scope
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      # ── THE Class B RELEVANCE LIST ────────────────────────────────────────
      # Same 19 entries the retired `paths:` blocks carried, plus the matcher
      # itself, so a change to the matcher re-runs what it gates.  Blank lines
      # and `#` comments are stripped by ci-changed-scope.sh, so the reasoning
      # can live next to the entries it explains.
      #
      # NOTE: firmware/safety_mcu/** is absent ON PURPOSE — see the header, and
      # see the "Scope assertions" step below, which fails if that ever changes.
      NP_SCOPE_PATHS: |
        firmware/bootloader/**
        firmware/hub_control/**
        firmware/vendor/**
        firmware/crypto/**
        firmware/ota/**
        firmware/zone_announce/**
        firmware/hrv_biofeedback/**
        firmware/pbm/**
        firmware/cervical_vns/**
        firmware/sloreta_hdtdcs/**
        firmware/anon/**
        firmware/edf/**
        firmware/factory_reset/**
        firmware/uhdr_key/**
        firmware/shdr/**
        firmware/common/**
        firmware/platform/**
        firmware/application/**
        firmware/CMakeLists.txt
        firmware/cmake/arm-none-eabi.cmake
        .github/workflows/firmware-cross-build.yml
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the matcher diffs against the merge base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      # The matcher decides whether anything gets built at all, so a broken
      # matcher would skip every job while every check went green — a gate that
      # reports success having verified nothing.  Its unit assertions therefore
      # run BEFORE it is trusted, on every invocation.
      - name: Matcher self-test
        run: scripts/ci-changed-scope.sh --self-test

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      # Assert THIS list, not just the matcher.  The self-test above proves the
      # glob semantics; these four cases prove the §5.0 dependency reasoning is
      # actually in force for Class B, and would fail loudly if someone widened
      # the list to `firmware/**` or narrowed it to nothing.
      # A well-formed pattern that matches nothing is a typo, not a scope
      # decision: `firmware/bootlaoder/**` would silently take the module out
      # of scope and every firmware job would skip while every check went green.
      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Scope assertions
        run: |
          set -euo pipefail
          assert() { # <expected> <path>
            printf '%s\n' "$2" > .scope-probe
            got=$(scripts/ci-changed-scope.sh --relevant scope.paths .scope-probe)
            if [ "$got" != "$1" ]; then
              echo "::error::Class B scope assertion failed: '$2' expected relevant=$1, got $got"
              exit 1
            fi
            echo "ok: $2 → $got"
          }
          assert true  firmware/bootloader/src/np_main.c
          assert true  firmware/crypto/np_sha256.c
          assert false firmware/safety_mcu/src/np_gpio_mgr.c
          assert false docs/np_sw_ci_001.md

      - name: Changed files
        id: diff
        env:
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fail-safe direction is BUILD.  Anything that leaves the scope of the
          # change genuinely unknown is treated as in scope rather than skipped:
          # skipping on uncertainty is how a gate becomes a no-op without anyone
          # noticing.  But "unknown" must mean actually unknown — see below.
          base=""
          if [ -n "${NP_BASE:-}" ] && [ "${NP_BASE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${NP_BASE}^{commit}" 2>/dev/null; then
            base="${NP_BASE}"
          elif [ "${{ github.event_name }}" = "push" ] \
               && git cat-file -e "origin/${NP_DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
            # A branch's FIRST push carries an all-zero `before`, so the naive
            # fail-safe ran a full firmware build on every new branch regardless
            # of what it touched — a §5.0 regression introduced by this very
            # change.  Measured on the phase-6 scratch PR (§6.7) before this
            # branch existed: the pull_request event skipped correctly while the
            # push event for the same commit built everything.  Scoping against
            # the default branch is both correct and cheaper.
            echo "::notice::no usable event base — scoping against origin/${NP_DEFAULT_BRANCH}"
            base="origin/${NP_DEFAULT_BRANCH}"
          fi
          # workflow_dispatch deliberately gets NO fallback.  A human asked for
          # this run, and on the default branch a default-branch fallback would
          # diff main against itself, find nothing, and skip every job — turning
          # the manual "build it now" button into a no-op.
          if [ -z "${base}" ] || ! git cat-file -e "${NP_HEAD}^{commit}" 2>/dev/null; then
            echo "::notice::no usable base revision (event=${{ github.event_name }}, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! merge_base=$(git merge-base "${base}" "${NP_HEAD}"); then
            echo "::notice::no merge base between ${base} and ${NP_HEAD} — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${merge_base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${merge_base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  host-tests:
    name: CMake host tests (Class B)
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    needs: changes
    # Skip ONLY on a definite negative.  `!= 'false'` rather than `== 'true'` is
    # deliberate: if the `changes` job errors, its output is empty and this job
    # runs anyway.  `== 'true'` would let a broken matcher silently skip every
    # firmware job while every check reported green.  `!cancelled()` is required
    # for the same reason from the other direction — without a status function a
    # failed `needs` skips this job, reinstating the same hole.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # Deliberately NOT continue-on-error.  19 of these 21 targets were a blocking
    # check under firmware-host-tests.yml; Phase 0's reporting-only mandate
    # covers the NEW cross-compile verification below, not the coverage this
    # workflow absorbed.  Downgrading them here would be a silent regression.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc

      - name: Configure (host test build)
        run: |
          cmake -B build/host-tests \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNP_BUILD_TESTS=ON \
                -DCMAKE_CROSSCOMPILING=OFF \
                firmware

      - name: Build
        run: cmake --build build/host-tests

      # Guard against selection drift before running anything: `ctest` exits 0
      # on a shrunken subset just as happily as on the whole suite, so a green
      # check is not evidence the targets ran.  Assert the count.
      - name: Assert test selection covers every Class B target
        run: |
          ctest --test-dir build/host-tests -N -E "$NP_SAFETY_TESTS" | tee selection.txt
          selected=$(sed -n 's/^Total Tests: //p' selection.txt)
          echo "selected=${selected} expected=${NP_CLASS_B_TEST_COUNT}"
          if [ "${selected}" != "${NP_CLASS_B_TEST_COUNT}" ]; then
            echo "::error::ctest selection drift — expected ${NP_CLASS_B_TEST_COUNT} Class B targets, matched ${selected}."
            exit 1
          fi

      - name: Run tests
        run: |
          ctest --test-dir build/host-tests \
                -E "$NP_SAFETY_TESTS" \
                --output-on-failure --no-tests=error

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-test-results
          path: build/host-tests/
          retention-days: 7

  bootloader:
    name: Bootloader (i.MX RT1062)
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # `needs: changes` is scope only and does NOT reintroduce the false
    # dependency the note below rejects — `changes` compiles nothing and cannot
    # fail for a firmware reason.  There is still no `needs: host-tests` here.
    #
    # NO `needs: host-tests` — deliberate, and NOT an oversight (NP-SW-CI-001 §5.0.1).
    # The bootloader is cross-compile-only: it is absent from the
    # NP_BUILD_TESTS branch entirely, and np_signature.c is deliberately
    # self-contained rather than depending on np_crypto, because
    # -nostdlib/-nodefaultlibs makes Monocypher unavailable.  There is no
    # native counterpart to gate on, so gating this leg on the Class B host
    # tests would be a FALSE dependency: an unrelated np_edf_tests failure
    # would block bootloader verification for no reason.  The rule is "do not
    # cross-build what failed natively", not "serialise everything behind
    # something".
    #
    # NOT `continue-on-error` as of phase 3 (NP-SW-CI-001 §6.4).  Defects B and
    # C are closed (§6.2, §6.3) and this leg builds clean on the pinned
    # toolchain, so a failure here is a regression rather than a known-bad
    # state.  A failing job now takes the workflow run with it.  Note what that
    # does and does not mean: the run reports failure, which is not the same as
    # the merge being blocked — no required-check policy exists yet, that is
    # OI-SWCI-04 at phase 6.
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      # Pinned rather than `latest` so a toolchain change is a reviewable commit
      # and not an unexplained red build.  Must satisfy the
      # NP_ARM_GCC_MIN_VERSION 12.3 gate in firmware/cmake/arm-none-eabi.cmake.
      - name: Record toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure
        run: |
          cmake -B build/cross -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/firmware/cmake/arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                firmware/bootloader

      # EXPECTED TO PASS as of phase 3.  This step was the reporting-only leg's
      # known failure through phases 0–2; both causes are now closed:
      #   Defect B (§4.2, phase 1): 19 unresolved memcpy + 7 memset under the
      #     deliberate -nostdlib -nostartfiles -nodefaultlibs.  Closed by
      #     freestanding implementations in src/np_mem.c — 26 unresolved → 0.
      #   Defect C (§4.3, phase 2): "OCRAM: 520 KB / 512 KB / 101.56%".  Linker
      #     arithmetic, not code size.  Closed by deriving the staging
      #     reservation from LENGTH(OCRAM) - _app_load_offset - _stack_size so
      #     the figure is written down nowhere — 101.56% → 100.00%, rc=0.
      #
      # 100.00% is the pass condition, not a near miss: the bootloader, the
      # staging area and the stack are specified to TILE OCRAM, and ld errors on
      # overflow rather than on full allocation.  That number will not move with
      # code size.  The code-size gate is a different mechanism — the linker
      # script's ASSERT on the 48 KiB _bl_max_size, currently ~26 KB used.  This
      # step being blocking protects both.
      #
      # No separate size-checking step: the bootloader links with
      # -Wl,--print-memory-usage and its linker script carries an ASSERT, so a
      # region overflow fails the link and therefore the job.  The link failing
      # IS the size test, and the linker is authoritative (§5.4).
      #
      # Not piped through `tail`/`grep`: `cmd | tail` reports tail's exit
      # status, which masked a failure during the §3 measurements.
      - name: Build
        run: cmake --build build/cross

      # OI-SWCI-35, CLOSED at phase 8.  This step used to be
      # `find build/cross -name '*.elf' | xargs -r arm-none-eabi-size`, and
      # `find` matching nothing piped to `xargs -r` EXITS 0 — so it passed while
      # reporting on zero files, every run since it was written, because CMake
      # gave the cross-compiled executable no suffix and the file was named
      # `np_bootloader`, not `np_bootloader.elf`.  Phase 7 found this shape on
      # the Class C leg and raised it here rather than fixing it out of scope.
      # Fixed on both sides, as there: SUFFIX ".elf" on the target in
      # firmware/bootloader/CMakeLists.txt, AND the count assertion below.
      # Either alone is a single point of silent failure.
      - name: Report image size
        if: success()
        run: |
          set -euo pipefail
          find build/cross -name 'np_bootloader.elf' -type f > /tmp/np-elves.txt
          n=$(wc -l < /tmp/np-elves.txt | tr -d ' ')
          echo "matched ${n} image(s):"; cat /tmp/np-elves.txt
          if [ "${n}" -ne 1 ]; then
            echo "::error::expected exactly 1 np_bootloader.elf, found ${n} — the link did not produce the documented artifact."
            exit 1
          fi
          elf=$(cat /tmp/np-elves.txt)
          arm-none-eabi-size "$elf"
          bytes=$(wc -c < "$elf" | tr -d ' ')
          echo "elf file size: ${bytes} bytes"
          [ "${bytes}" -gt 4096 ] || { echo "::error::np_bootloader.elf is ${bytes} bytes — implausibly small for the bootloader image."; exit 1; }

      # NP-SW-CI-001 §4.10 (OI-SWCI-39).  The bootloader is the only code that
      # runs before the application's Reset_Handler touches DTCM, so it is the
      # only place the FlexRAM partition can be established — and it is
      # established by ONE call, from ONE function, which --gc-sections is
      # entitled to drop the moment anything stops referencing it.  The image
      # would still link, still be under 48 KiB, and still boot; the
      # application would then be linked for 512 KiB of DTCM the fuses had
      # never been asked for.  Nothing else in this leg would notice, which is
      # what makes it worth a step.
      #
      # Written to a file before grepping, for the reason the SW-02 leg's
      # equivalent step records at length: `nm "$elf" | grep -q` under
      # `set -o pipefail` fails on an image that DOES contain the symbol,
      # because grep -q exits early and nm takes SIGPIPE.
      - name: Assert the bootloader establishes the FlexRAM partition
        if: success()
        run: |
          set -euo pipefail
          # Located the same way the step above locates it, rather than by a
          # hardcoded path: this job configures firmware/bootloader as the
          # source directory, so the ELF is at the root of build/cross and not
          # under a bootloader/ subdirectory the way the SW-02 leg's is.
          elf=$(find build/cross -name 'np_bootloader.elf' -type f | head -1)
          [ -n "$elf" ] || { echo "::error::np_bootloader.elf missing."; exit 1; }
          arm-none-eabi-nm "$elf" > /tmp/np-bl-syms.txt
          grep -qE '^[0-9a-f]+ [Tt] np_flexram_apply_partition$' /tmp/np-bl-syms.txt || {
            echo "::error::np_flexram_apply_partition is not in the bootloader image — the FlexRAM partition would be left at whatever the eFuses say (OI-SWCI-39)."
            exit 1; }
          echo "ok: np_flexram_apply_partition is in the bootloader image"
          # The three bank fields the linker script declares must be in the
          # symbol table too, so the ASSERTs that check them actually ran on
          # this artifact rather than on a script edited out of the build.
          for sym in NP_FLEXRAM_ITCM_BANKS NP_FLEXRAM_DTCM_BANKS NP_FLEXRAM_OCRAM_BANKS; do
            grep -qE "^[0-9a-f]+ A ${sym}\$" /tmp/np-bl-syms.txt || {
              echo "::error::${sym} is not defined in the bootloader image — the linker script's partition ASSERTs did not run."
              exit 1; }
          done
          echo "ok: the linker script's FlexRAM partition symbols are present"

      - name: Upload map and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-build-bootloader
          path: |
            build/cross/**/*.map
            build/cross/**/CMakeFiles/*.log
          retention-days: 7
          if-no-files-found: ignore

  main-firmware:
    name: Main firmware (i.MX RT1062, Class B)
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    # A genuine native counterpart exists for these modules (the 19 host-test
    # targets above), so §5.0.1 applies: do not spend runner minutes
    # cross-compiling what already failed natively.
    needs: [changes, host-tests]
    # `needs.host-tests.result == 'success'` is written out EXPLICITLY rather
    # than left to GitHub's implicit skip-on-failed-need.  A custom `if:` that
    # contains a status function (`!cancelled()`) replaces the default
    # `success()`, so without this clause a failed `host-tests` would no longer
    # stop the cross-build — §5.0.1's ordering rule would be silently gone while
    # every file still looked correct.  This is the specific way converting
    # `paths:` to `if:` can turn a gate into a no-op.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' && needs.host-tests.result == 'success' }}
    # NOT `continue-on-error` as of phase 5 (NP-SW-CI-001 §6.6).  Defect D is
    # closed — np_mod_pbm.c:112 called np_pbm_dose_load_cal, a symbol that
    # never existed, and now loads calibration one wavelength row per zone via
    # np_pbm_dose_load_cal_stub (§4.6).  It was the sole error in the whole
    # super-project, so this leg is green and a regression should turn the run
    # red rather than be masked.  This is the last leg to be promoted: no
    # `continue-on-error` remains anywhere in .github/workflows/.
    #
    # PROMOTED AT PHASE 8 — this leg now gates a LINK, not only a compile.
    # OI-SWCI-21 is closed: firmware/application/ builds np_application.elf, so
    # "zero unresolved symbols" on this leg is a claim about SW-02 rather than a
    # claim about np_bootloader with SW-02 standing next to it.  Read it for
    # what it now claims: every SW-02 translation unit compiles under
    # -Wall -Wextra -Werror AND the whole set links into one image with nothing
    # unresolved.  It is still NOT a claim that the image runs — its platform
    # layer is 93 traps (§4.8), and the image says so about itself.
    #
    # As at phases 3 and 4: the run reporting failure is not the same as the
    # merge being blocked.  No required-check policy exists yet — OI-SWCI-04,
    # phase 6.
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      - name: Record toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure
        run: |
          cmake -B build/cross -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/firmware/cmake/arm-none-eabi.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                firmware

      # EXPECTED TO PASS as of phase 8.  Measured 2026-09-01 on
      # arm-none-eabi-gcc 13.2.1: 96 targets, 0 errors, 0 warnings,
      # 15 static libraries, 2 executables, 0 unresolved symbols.
      #
      # NP_PLATFORM_INCLUDE_DIRS is no longer an empty MCUX stub — OI-SWCI-20
      # closed at phase 8 and firmware/vendor/mcux_sdk/ carries the vendored
      # MIMXRT1062 device layer.  What phase 5 measured about it stays true and
      # is worth keeping: the include path being empty caused ZERO
      # missing-header errors, because nothing included anything from it.  A
      # missing dependency is invisible while nothing depends on it, which is
      # the same sentence as §4.7 with different nouns.
      #
      # What a green result here means NOW: every SW-02 translation unit
      # compiled, and they LINK — np_application.elf, 0 unresolved symbols.
      # It does not mean the image runs (§4.8).
      #
      # The build also runs two assertions of its own, so they cannot be
      # skipped by anyone building locally: the SW-02 platform seam census
      # (firmware/cmake/np_platform_census.cmake) and the linker script's own
      # ASSERTs on image placement and size.  The steps below re-check the
      # second family on the artifact, because a linker ASSERT proves the link
      # and not the file that survived it.
      #
      # Not piped through `tail`/`grep`: `cmd | tail` reports tail's exit
      # status, which masked a failure during the §3 measurements.
      - name: Build
        run: cmake --build build/cross

      # Same shape, and the same reasoning, as the bootloader leg above and the
      # Class C leg in safety-mcu-ci.yml: an explicit count, never a glob piped
      # to `xargs -r`.  Two images are expected here — np_bootloader.elf is
      # built by this super-project too, and is gated separately by the
      # bootloader job; np_application.elf is this leg's own artifact.
      - name: Report image sizes
        if: success()
        run: |
          set -euo pipefail
          find build/cross -name '*.elf' -type f | sort > /tmp/np-elves.txt
          n=$(wc -l < /tmp/np-elves.txt | tr -d ' ')
          echo "matched ${n} image(s):"; cat /tmp/np-elves.txt
          if [ "${n}" -ne 2 ]; then
            echo "::error::expected exactly 2 ELFs (np_bootloader.elf, np_application.elf), found ${n}."
            exit 1
          fi
          while read -r elf; do arm-none-eabi-size "$elf"; done < /tmp/np-elves.txt
          app=build/cross/application/np_application.elf
          [ -f "$app" ] || { echo "::error::np_application.elf missing — phase 8's artifact did not link."; exit 1; }
          bytes=$(wc -c < "$app" | tr -d ' ')
          echo "np_application.elf file size: ${bytes} bytes"
          [ "${bytes}" -gt 4096 ] || { echo "::error::np_application.elf is ${bytes} bytes — implausibly small for the SW-02 image."; exit 1; }

      # The linker script ASSERTs that the loadable image fits the bootloader's
      # 440 KiB reservation, and a region overflow is a hard link error, so both
      # already fail the build.  What neither catches is silent GROWTH toward
      # those walls: an image at 95% of the reservation still links, and the
      # first anyone hears of it is a failed build after the next feature.
      # Budgets are deliberately generous against the 2026-09-01 measurement
      # (loadable 48,208 B = 10.7%; STAGING total incl. .bss 202,164 B = 44.9%)
      # so this is a tripwire, not a straitjacket.
      #
      # The loadable figure is taken from the .bin, not from `size`: the .bin is
      # byte-for-byte what the bootloader copies, so it is the number
      # np_app_image_size_check() will actually be given.
      - name: Assert the SW-02 image fits its budgets
        if: success()
        run: |
          set -euo pipefail
          bin=build/cross/np_application.bin
          [ -f "$bin" ] || { echo "::error::np_application.bin missing."; exit 1; }
          staging_max=$(( 440 * 1024 ))
          loadable=$(wc -c < "$bin" | tr -d ' ')
          echo "loadable image ${loadable}/${staging_max} B"
          [ "$loadable" -le $(( staging_max * 50 / 100 )) ] || { echo "::error::loadable image ${loadable} B exceeds 50% of the ${staging_max} B staging reservation."; exit 1; }
          # STAGING also holds .bss (see the linker script's .bss comment), so
          # the region total is what actually runs out, not the image.
          bss_end=$(arm-none-eabi-nm build/cross/application/np_application.elf | awk '$3=="__bss_end__"{print $1}')
          origin=$(arm-none-eabi-nm build/cross/application/np_application.elf | awk '$3=="__isr_vector_start"{print $1}')
          used=$(( 0x$bss_end - 0x$origin ))
          echo "STAGING region ${used}/${staging_max} B"
          [ "$used" -le $(( staging_max * 75 / 100 )) ] || { echo "::error::STAGING use ${used} B exceeds 75% of ${staging_max} B — .bss is crowding the reservation."; exit 1; }

      # NP-SW-CI-001 §4.10 (OI-SWCI-39).  The application's MSP stack is pinned
      # to the top of DTCM and its .data runs there, so the image encodes an
      # assumption about how big DTCM is — an assumption the BOOTLOADER
      # satisfies, in a different image, from a different linker script.  The
      # application's own link cannot check it: a DTCM region larger than the
      # banks np_flexram_apply_partition() assigns links cleanly and faults at
      # the first access to memory that does not exist.
      #
      # np_app_link_agreement_tests already checks the three declarations
      # against each other, on the sources.  This checks the ARTIFACT, which is
      # the one thing a source-level test cannot: that the ELF actually built
      # from them puts __StackTop at DTCM base + the partition's DTCM size.
      # The expected value is recomputed here from the bank counts in
      # np_config.h rather than restated, so this step cannot become a fourth
      # copy of the number it is checking.
      - name: Assert the SW-02 image matches the established DTCM partition
        if: success()
        run: |
          set -euo pipefail
          elf=build/cross/application/np_application.elf
          [ -f "$elf" ] || { echo "::error::np_application.elf missing."; exit 1; }
          hdr=firmware/bootloader/include/np_config.h
          # Read the macro bodies and let shell arithmetic evaluate them, so
          # "(32U * 1024U)" needs no second transcription here.  Trailing
          # comments are cut; the U/UL suffixes are dropped because $(( ))
          # does not accept them.
          val() {
            sed -n "s|^#define[[:space:]]\{1,\}$1[[:space:]]\{1,\}||p" "$hdr" \
              | head -1 | sed 's|/\*.*||' | tr -d 'UL' | tr -d '\r'
          }
          banks=$(val NP_FLEXRAM_DTCM_BANKS)
          bank_size=$(val NP_FLEXRAM_BANK_SIZE)
          base=$(val NP_DTCM_BASE)
          for v in banks bank_size base; do
            eval "x=\$$v"
            [ -n "$x" ] || { echo "::error::could not read $v from ${hdr}."; exit 1; }
          done
          want=$(( base + banks * bank_size ))
          arm-none-eabi-nm "$elf" > /tmp/np-app-dtcm-syms.txt
          got=$(awk '$3=="__StackTop"{print $1}' /tmp/np-app-dtcm-syms.txt)
          [ -n "$got" ] || { echo "::error::__StackTop is not in the image."; exit 1; }
          printf 'DTCM %s banks; __StackTop = 0x%s, expected 0x%08X\n' "$banks" "$got" "$want"
          [ "$(( 0x$got ))" -eq "$want" ] || {
            echo "::error::__StackTop is not at the top of the DTCM the partition establishes — the application is linked for a DTCM the bootloader does not create."
            exit 1; }
          echo "ok: the image's DTCM matches the established FlexRAM partition"

      # The link proves the symbols resolve; these prove WHAT they resolved to.
      # Direct counterpart of the Class C leg's step of the same name.
      - name: Assert the SW-02 image is whole and free of test doubles
        if: success()
        run: |
          set -euo pipefail
          elf=build/cross/application/np_application.elf
          map=build/cross/np_application.map
          undef=$(arm-none-eabi-nm -u "$elf" | wc -l | tr -d ' ')
          echo "undefined symbols in np_application.elf: ${undef}"
          [ "${undef}" -eq 0 ] || { echo "::error::${undef} symbols are still undefined in the SW-02 image."; arm-none-eabi-nm -u "$elf" | head -40; exit 1; }
          if grep -qE '(^|/)tests/[A-Za-z0-9_]+\.c\.obj' "$map"; then
            echo "::error::a file from tests/ is linked into the SW-02 image — a test double is the shortest path to a green, useless link."
            grep -nE '(^|/)tests/[A-Za-z0-9_]+\.c\.obj' "$map" | head
            exit 1
          fi
          echo "ok: no tests/ object in the image"
          # The image must actually contain the trap layer.  If it did not, the
          # platform seams resolved to something else, and this leg would be
          # reporting on an image nobody in this repository wrote.
          #
          # Written to a file first, deliberately.  `nm "$elf" | grep -q PATTERN`
          # under `set -o pipefail` FAILS EVEN WHEN THE PATTERN MATCHES: grep -q
          # exits on the first hit, nm dies of SIGPIPE, and pipefail promotes
          # that 141 to the pipeline's status.  Measured locally on 2026-09-01,
          # against an image that did contain the symbol.  A step that reports a
          # failure for a symbol that is present is worse than no step.
          arm-none-eabi-nm "$elf" > /tmp/np-app-syms.txt
          grep -qE '^[0-9a-f]+ T np_platform_unimplemented$' /tmp/np-app-syms.txt || {
            echo "::error::np_platform_unimplemented is not in the image — the platform seams resolved somewhere unexpected."; exit 1; }
          echo "ok: the platform trap layer is in the image"

      # Independent re-run of the seam census the build already performs, so a
      # green leg states the number rather than assuming the POST_BUILD step ran
      # (it does not re-run when nothing was rebuilt).  NP-SW-CI-001 §4.8.
      - name: Assert the SW-02 platform seam census
        if: success()
        run: |
          set -euo pipefail
          expected=$(sed -n 's/^#define[[:space:]]*NP_SW02_PLATFORM_SYMBOL_COUNT[[:space:]]*\([0-9]*\).*/\1/p' \
                     firmware/platform/include/np_sw02_platform_hal.h)
          [ -n "$expected" ] || { echo "::error::NP_SW02_PLATFORM_SYMBOL_COUNT not found in the header."; exit 1; }
          obj=$(find build/cross -name 'np_platform_stub.c.obj' -type f | head -1)
          [ -n "$obj" ] || { echo "::error::np_platform_stub.c.obj not found — the census has nothing to count."; exit 1; }
          count=$(arm-none-eabi-nm --defined-only --extern-only "$obj" | grep -cE ' [Tt] ')
          echo "SW-02 platform seams: ${count} trapped, 0 driven (expected ${expected})"
          [ "${count}" -eq "${expected}" ] || { echo "::error::census is ${count}, header says ${expected}."; exit 1; }

      - name: Upload map and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cross-build-main-firmware
          path: |
            build/cross/**/*.map
            build/cross/**/CMakeFiles/*.log
          retention-days: 7
          if-no-files-found: ignore
