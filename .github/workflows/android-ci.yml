name: Android CI (Gradle)

# Builds :core (pure JVM) and runs the :app unit tests (:app:testDebugUnitTest) and the
# cloud storage adapters' tests (:cloudstore:jvmTest) and the sign-in tests (:cloudauth:jvmTest).
# These are JVM unit tests — NO emulator/AVD required — so an ubuntu-latest
# runner is sufficient and cheap. Add a separate connectedCheck job on a
# macOS/KVM runner only if instrumented (androidTest) tests are ever added.
#
# Gradle is provisioned by gradle/actions/setup-gradle (gradle-version) rather than
# by the wrapper. The wrapper IS committed (app/android/gradlew +
# gradle/wrapper/gradle-wrapper.jar, pinned to the same 8.11.1), so the run steps
# below could be switched from `gradle` to `./gradlew`; pinning the version here
# instead keeps the CI toolchain explicit and independent of the checked-in wrapper.
#
# .github/workflows/codeql.yml provisions the same toolchain for its java-kotlin
# leg. Keep the JDK, SDK, and Gradle versions in the two files in sync.

on:
  # Push only validates the default branch after a merge. A PR branch is covered by
  # pull_request, so it no longer triggers two runs of the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This job only checks out the repo and builds/tests it; nothing
# reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission. gradle/actions/setup-gradle
# would need contents:write only for `dependency-graph: generate-and-submit`,
# which this workflow does not enable.)
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same PR. Only pull_request
# runs are cancelled: a run on the default branch is never cancelled by a later merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Per-commit relevance (NP-SW-CI-001 §6.7). Replaces the `pull_request: paths:`
  # filter, which GitHub evaluates against the WHOLE pull request: once a PR touched
  # one of these paths, every later commit re-ran this workflow, however small. This
  # job diffs from the last green run of this workflow on the branch instead, so a
  # commit that cannot affect the build skips it. A job skipped by `if:` reports
  # `skipped`, which satisfies a required check; a `paths:`-suppressed workflow
  # never reports at all.
  changes:
    name: Relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      NP_SCOPE_PATHS: |
        app/android/**
        app/NeurOneUI/**
        common/core/**
        # The cloud storage adapters and their tests (issue #566); :core depends on this module.
        common/cloudstore/**
        common/cloudauth/**
        app/NeurOneShared/TestData/**
        # The shared NPPS core (OI-NPPS-CORE-01): :core's tests build common/npps-jni with cargo and
        # push the shipped library and the fixtures through it.
        common/Cargo.toml
        common/Cargo.lock
        common/npps/**
        common/npps-core/**
        common/npps-jni/**
        common/btle-jni/**
        protocols/predefined/**
        npps/fixtures/**
        locales/**
        scripts/sync-locales.ts
        .github/workflows/android-ci.yml
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Changed files
        id: diff
        env:
          NP_EVENT: ${{ github.event_name }}
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NP_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          NP_REPO: ${{ github.repository }}
          NP_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          NP_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! merge_base=$(scripts/ci-changed-scope.sh --diff-base \
                 "$NP_EVENT" "${NP_BASE:-}" "$NP_HEAD" "$NP_DEFAULT_BRANCH" "$NP_REF") \
             || [ -z "$merge_base" ]; then
            echo "::notice::no usable base revision (event=$NP_EVENT, ref=$NP_REF, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(scripts/ci-changed-scope.sh --resolve-base android-ci.yml "$merge_base" \
                   "$NP_EVENT" "$NP_HEAD" "$NP_HEAD_BRANCH" "$NP_DEFAULT_BRANCH" "$NP_HEAD_REPO" "$NP_REPO")
          git diff --name-only "${base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  android-unit-tests:
    name: Gradle unit tests (:core + :app)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # AGP 8.9.3 requires JDK 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `packages` defaults to `tools platform-tools`, and the obsolete `tools`
          # package is no longer in the SDK repository — so the action's own
          # sdkmanager call fails before any NeurOne step runs:
          #     Warning: Failed to find package 'tools'
          #     Error: The process '.../sdkmanager' failed with exit code 1
          # Nothing is lost by installing none here. The next step installs the
          # three packages this build actually needs, which makes it the single
          # statement of what that is rather than a partial overlap with a default.
          packages: ''

      - name: Install SDK packages (compileSdk 36 + build-tools + platform-tools)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      # The :app build generates res/values*/strings.xml from locales/*.json via
      # the syncLocales Gradle task, which shells out to bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # :desktop:test builds common/btle-jni, whose btleplug links libdbus on Linux (BlueZ).
      - name: Install libdbus (btleplug on Linux)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      # :core's test task runs `cargo build` for common/npps-jni (OI-NPPS-CORE-01). The runner image
      # ships rustup; this pins the channel so a stale image cannot change what is built.
      - name: Set up Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown   # :core:wasmJsNodeTest and :web build the core as WebAssembly
          cargo --version

      # The APK carries the Rust NPPS core for four ABIs (:app's buildNppsCoreNative, via cargo-ndk).
      - name: Install NDK, the Rust Android targets and cargo-ndk
        run: |
          sdkmanager "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android i686-linux-android
          cargo install cargo-ndk --locked

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'   # AGP 8.9.3 requires Gradle >= 8.11.1

      - name: Build :core, :shared, :desktop and :web, and run unit tests
        run: gradle :core:jvmTest :cloudstore:jvmTest :cloudauth:jvmTest :core:wasmJsNodeTest :shared:desktopTest :desktop:test :web:compileKotlinWasmJs :app:testDebugUnitTest --stacktrace

      # The compiler calls the core through JNI, so an APK without the library cannot upload a
      # protocol. The unit tests cannot see that; this does.
      - name: The APK carries the NPPS core for every ABI
        run: |
          gradle :app:assembleDebug --stacktrace
          apk=$(ls app/build/outputs/apk/debug/*.apk | head -n 1)
          for abi in arm64-v8a armeabi-v7a x86_64 x86; do
            unzip -l "$apk" | grep -q "lib/$abi/libneurone_npps_jni.so" \
              || { echo "::error::$apk has no lib/$abi/libneurone_npps_jni.so"; exit 1; }
            echo "ok: $abi"
          done

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            common/core/build/reports/tests/
            app/android/app/build/reports/tests/
          if-no-files-found: ignore
