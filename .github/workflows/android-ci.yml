name: Android CI (Gradle)

# Builds :core (pure JVM) and runs the :app unit tests (:app:testDebugUnitTest).
# These are JVM unit tests — NO emulator/AVD required — so an ubuntu-latest
# runner is sufficient and cheap. Add a separate connectedCheck job on a
# macOS/KVM runner only if instrumented (androidTest) tests are ever added.
#
# Gradle is provisioned by gradle/actions/setup-gradle (gradle-version), so this
# job does NOT depend on a committed wrapper — it is green from the first run.
# Once app/android/gradlew + gradle/wrapper/gradle-wrapper.jar are committed, the
# run steps below may be switched from `gradle` to `./gradlew` if preferred.

on:
  push:
    paths:
      - 'app/android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    paths:
      - 'app/android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-unit-tests:
    name: Gradle unit tests (:core + :app)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'   # AGP 8.9.3 requires JDK 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages (compileSdk 36 + build-tools + platform-tools)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'   # AGP 8.9.3 requires Gradle >= 8.11.1

      - name: Build :core and run unit tests
        run: gradle :core:test :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            app/android/core/build/reports/tests/
            app/android/app/build/reports/tests/
          if-no-files-found: ignore
