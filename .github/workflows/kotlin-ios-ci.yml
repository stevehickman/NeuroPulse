name: Kotlin iOS CI (Gradle, macOS)

# Compiles the Kotlin iOS targets of :core and :shared, and links the NeurOneShared framework for the
# simulator. Nothing else compiles them: android-ci.yml runs on Linux, where the Apple targets are
# disabled (kotlin.native.ignoreDisabledTargets), so iosMain code (IosBleCentral, IosDirectoryFileStore,
# the NPPS cinterop, the iOS wiring) was unbuilt until this job (OI-UI-KMP-06).
#
# It then builds the Xcode host app/NeurOneUI/iosApp for the simulator, whose pre-build phase runs Gradle's
# embedAndSignAppleFrameworkForXcode. This is a build gate only: no iOS test runs and no simulator starts.
# Kotlin/Native needs Xcode, so the job runs on macOS; :core's cinterop needs
# libneurone_npps_ffi.a for each Apple architecture, which :core builds with cargo on a macOS host.
#
# .github/workflows/android-ci.yml provisions the same JDK, Android SDK and Gradle: :shared also has an
# Android target, so Gradle configures it here. Keep the versions in the two files in sync.

on:
  # Push only validates the default branch after a merge. A PR branch is covered by
  # pull_request, so it no longer triggers two runs of the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the job only checks out and builds; nothing reads GITHUB_TOKEN or publishes.
permissions:
  contents: read

jobs:
  # Per-commit relevance (NP-SW-CI-001 §6.7). Replaces the `pull_request: paths:`
  # filter, which GitHub evaluates against the WHOLE pull request: once a PR touched
  # one of these paths, every later commit re-ran this workflow, however small. This
  # job diffs from the last green run of this workflow on the branch instead, so a
  # commit that cannot affect the build skips it. A job skipped by `if:` reports
  # `skipped`, which satisfies a required check; a `paths:`-suppressed workflow
  # never reports at all.
  changes:
    name: Relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
      macos: ${{ steps.pins.outputs.macos }}
    env:
      NP_SCOPE_PATHS: |
        app/android/**
        app/NeurOneUI/**
        common/core/**
        # The cloud storage adapters (issue #566) compile for iOS as a dependency of :core.
        common/cloudstore/**
        common/cloudauth/**
        app/NeurOneShared/TestData/**
        common/Cargo.toml
        common/Cargo.lock
        common/npps/**
        common/npps-core/**
        common/npps-ffi/**
        protocols/predefined/**
        locales/**
        scripts/sync-locales.ts
        .github/workflows/kotlin-ios-ci.yml
        .github/toolchain.json
        .github/actions/setup-toolchain/**
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read the macOS image
        id: pins
        run: echo "macos=$(jq -er .macos .github/toolchain.json)" >> "$GITHUB_OUTPUT"

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Changed files
        id: diff
        env:
          NP_EVENT: ${{ github.event_name }}
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NP_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          NP_REPO: ${{ github.repository }}
          NP_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          NP_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! merge_base=$(scripts/ci-changed-scope.sh --diff-base \
                 "$NP_EVENT" "${NP_BASE:-}" "$NP_HEAD" "$NP_DEFAULT_BRANCH" "$NP_REF") \
             || [ -z "$merge_base" ]; then
            echo "::notice::no usable base revision (event=$NP_EVENT, ref=$NP_REF, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(scripts/ci-changed-scope.sh --resolve-base kotlin-ios-ci.yml "$merge_base" \
                   "$NP_EVENT" "$NP_HEAD" "$NP_HEAD_BRANCH" "$NP_DEFAULT_BRANCH" "$NP_HEAD_REPO" "$NP_REPO")
          git diff --name-only "${base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  kotlin-ios-compile:
    name: Compile Kotlin iOS targets and build iosApp
    runs-on: ${{ needs.changes.outputs.macos }}
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    defaults:
      run:
        working-directory: app/android

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up the JDK
        uses: ./.github/actions/setup-toolchain
        with:
          java: 'true'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install SDK packages (compileSdk 36 + build-tools + platform-tools)
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      # The build generates resources from locales/*.json with bun (CLAUDE.md §17).
      - name: Set up Bun
        uses: ./.github/actions/setup-toolchain
        with:
          bun: 'true'

      # :core's cinterop links libneurone_npps_ffi.a, which Gradle builds with cargo for each Apple triple.
      - name: Set up Rust with the iOS targets
        uses: ./.github/actions/setup-toolchain
        with:
          rust: 'true'
          rust-targets: 'aarch64-apple-ios aarch64-apple-ios-sim'

      - name: Set up Gradle
        uses: ./.github/actions/setup-toolchain
        with:
          gradle: 'true'

      - name: Compile the iOS targets and link the NeurOneShared framework
        run: >
          gradle
          :core:compileKotlinIosArm64 :core:compileKotlinIosSimulatorArm64
          :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64
          :shared:linkDebugFrameworkIosSimulatorArm64
          --stacktrace

      # The iOS-only tests (REQ-UHDRFP-01): a recording file manager stands in for the real one, so the simulator's lack of Data
      # Protection does not matter.
      - name: Run the iOS tests of the shared UI
        run: gradle :shared:iosSimulatorArm64Test --stacktrace

      # arm64 only: a generic simulator destination also builds x86_64, which :shared has no target for, and Compose's
      # resource sync (syncComposeResourcesForIos) then has no value to use for that architecture.
      # The host's pre-build phase calls ./gradlew, which reads ANDROID_HOME and needs bun and cargo on PATH,
      # all of which the steps above leave in the environment.
      - name: Build the Xcode host (iosApp) for the simulator
        working-directory: app/NeurOneUI/iosApp
        run: |
          brew install xcodegen
          xcodegen generate --spec project.yml
          xcodebuild build -project NeurOneUI.xcodeproj -scheme NeurOneUI \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO
