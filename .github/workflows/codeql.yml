# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '33 15 * * 4'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Runner size impacts CodeQL analysis time. To learn more, please see:
    #   - https://gh.io/recommended-hardware-resources-for-running-codeql
    #   - https://gh.io/supported-runners-and-hardware-resources
    #   - https://gh.io/using-larger-runners (GitHub.com only)
    # Consider using larger runners or machines with greater resources for possible analysis time improvements.
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      # required for all workflows
      security-events: write

      # required to fetch internal or private CodeQL packs
      packages: read

      # only required for workflows in private repositories
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: c-cpp
          build-mode: none
        - language: csharp
          build-mode: none
        # 'manual', not 'autobuild': CodeQL's Java autobuilder runs from the source
        # root, and this repo's root holds no JVM build file — the Gradle project is
        # at app/android/. Autobuild therefore exits with "Could not detect a suitable
        # build command for the source checkout" and the job ends as a configuration
        # error. The explicit build steps below compile it instead. Buildless
        # ('none') would also go green, but CodeQL notes that buildless extraction
        # "will generally yield less accurate analysis results", and app/android holds
        # the BLE, consent, and session-data code — worth a real build.
        - language: java-kotlin
          build-mode: manual
        - language: javascript-typescript
          build-mode: none
        - language: python
          build-mode: none
        - language: swift
          build-mode: autobuild
        # CodeQL supports the following values keywords for 'language': 'actions', 'c-cpp', 'csharp', 'go', 'java-kotlin', 'javascript-typescript', 'python', 'ruby', 'rust', 'swift'
        # Use `c-cpp` to analyze code written in C, C++ or both
        # Use 'java-kotlin' to analyze code written in Java, Kotlin or both
        # Use 'javascript-typescript' to analyze code written in JavaScript, TypeScript or both
        # To learn more about changing the languages that are analyzed or customizing the build mode for your analysis,
        # see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning.
        # If you are analyzing a compiled language, you can modify the 'build-mode' for that language to customize how
        # your codebase is analyzed, see https://docs.github.com/en/code-security/code-scanning/creating-an-advanced-setup-for-code-scanning/codeql-code-scanning-for-compiled-languages
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    # Setup steps for the 'manual' java-kotlin build below. These MUST run before
    # `github/codeql-action/init` — CodeQL resolves the toolchain at init time.
    #
    # Every step here is gated on the java-kotlin leg: the other six languages in the
    # matrix are all build-mode 'none' and need no toolchain, so an ungated step would
    # add minutes of Android SDK download to six jobs that are already green.
    #
    # The versions mirror .github/workflows/android-ci.yml, which builds this same
    # Gradle project successfully on ubuntu-latest. Keep the two in sync.

    - name: Set up JDK 17
      if: matrix.language == 'java-kotlin'
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'   # AGP 8.9.3 requires JDK 17

    - name: Set up Android SDK
      if: matrix.language == 'java-kotlin'
      uses: android-actions/setup-android@v3

    - name: Install SDK packages (compileSdk 36 + build-tools + platform-tools)
      if: matrix.language == 'java-kotlin'
      run: |
        yes | sdkmanager --licenses >/dev/null || true
        sdkmanager "platforms;android-36" "build-tools;35.0.0" "platform-tools"

    - name: Set up Gradle 8.11.1
      if: matrix.language == 'java-kotlin'
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.11.1'   # AGP 8.9.3 requires Gradle >= 8.11.1

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.

        # For more details on CodeQL's query packs, refer to: https://docs.github.com/en/code-security/code-scanning/automatically-scanning-your-code-for-vulnerabilities-and-errors/configuring-code-scanning#using-queries-in-ql-packs
        # queries: security-extended,security-and-quality

    # Manual build for java-kotlin. Must run AFTER init (so CodeQL is tracing) and
    # BEFORE analyze (which needs a populated database).
    #
    # Gated on the language, not just `build-mode == 'manual'`: if another language is
    # ever switched to manual, it must get its own step rather than silently inheriting
    # a Gradle command that has nothing to do with it.
    #
    # `:core` is a plain kotlin("jvm") + java-library module, so it has NO assembleDebug
    # task — `:core:assemble` is its equivalent. `:app:assembleDebug` pulls :core in
    # anyway via implementation(project(":core")); naming it explicitly keeps the trace
    # unambiguous. Main sources only: the 19 test sources are compiled and run by
    # android-ci.yml, and coupling the security scan to test-code health would make a
    # red CodeQL check mean two unrelated things.
    #
    # --no-daemon: CodeQL traces compilation with preload_tracer. A reused Gradle daemon
    # can host the compile outside the traced process tree, producing an empty database
    # that still reports success.
    #
    # --no-build-cache: same failure shape, different cause. app/android/gradle.properties
    # does not currently set org.gradle.caching, but if it ever does, cached compile task
    # outputs would be replayed instead of recompiled — CodeQL would trace nothing, the
    # database would be empty, and this job would still go green. A silently empty scan is
    # worse than a red one, because it stops anyone from looking again. Costs nothing on a
    # cold runner.
    #
    # If Kotlin extraction is ever empty despite a successful build, the next thing to try
    # is -Dkotlin.compiler.execution.strategy=in-process: --no-daemon stops the *Gradle*
    # daemon, but Kotlin still compiles in a separate KotlinCompileDaemon JVM.
    - name: Build Android project (:core + :app)
      if: matrix.language == 'java-kotlin'
      shell: bash
      working-directory: app/android
      run: gradle :core:assemble :app:assembleDebug --no-daemon --no-build-cache --stacktrace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
