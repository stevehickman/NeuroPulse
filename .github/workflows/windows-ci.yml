name: Windows CI (dotnet)

# Builds the Windows app (app/windows/NeurOne) and runs NeurOne.Tests.
#
# The project targets net8.0-windows10.0.19041.0, so it needs a Windows runner. The tests are
# plain xunit (no UI, no device), and the one that matters here is HubDescriptorCompilerTests:
# it diffs the Windows compiler's output byte for byte against
# app/NeurOneShared/TestData/hub-descriptor-golden.json, which is the web compiler's
# own output (scripts/gen-hub-descriptor-golden.ts). Android's and iOS's CI diff the same file,
# which is what keeps the three native compilers on the one NP-FW-HUB-001 §4 wire (OI-AND-WIRE-01).
# The golden file and the zone file the tests read are therefore build inputs and are in
# `paths:` below, even though neither lives under app/windows/**.

on:
  # Push only validates the default branch after a merge. A PR branch is covered by
  # pull_request, so it no longer triggers two runs of the same commit.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. This job only checks out the repo and builds/tests it; nothing reads
# GITHUB_TOKEN, calls the API, or publishes. contents:read is what actions/checkout needs.
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Per-commit relevance (NP-SW-CI-001 §6.7). Replaces the `pull_request: paths:`
  # filter, which GitHub evaluates against the WHOLE pull request: once a PR touched
  # one of these paths, every later commit re-ran this workflow, however small. This
  # job diffs from the last green run of this workflow on the branch instead, so a
  # commit that cannot affect the build skips it. A job skipped by `if:` reports
  # `skipped`, which satisfies a required check; a `paths:`-suppressed workflow
  # never reports at all.
  changes:
    name: Relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      NP_SCOPE_PATHS: |
        app/windows/**
        app/NeurOneShared/TestData/hub-descriptor-golden.json
        # The serializer and validator are the core's too: the tests push these goldens through the binding.
        app/NeurOneShared/TestData/npps-serialize-golden.json
        app/NeurOneShared/TestData/npps-validate-golden.json
        app/NeurOneShared/TestData/nfkc-corpus.json
        protocols/predefined/**
        # The compiler is the Rust core, built here and called through P/Invoke.
        common/npps-core/**
        common/npps-ffi/**
        common/npps/**
        common/Cargo.toml
        common/Cargo.lock
        .github/workflows/windows-ci.yml
        .github/toolchain.json
        .github/actions/setup-toolchain/**
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Changed files
        id: diff
        env:
          NP_EVENT: ${{ github.event_name }}
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NP_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          NP_REPO: ${{ github.repository }}
          NP_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          NP_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! merge_base=$(scripts/ci-changed-scope.sh --diff-base \
                 "$NP_EVENT" "${NP_BASE:-}" "$NP_HEAD" "$NP_DEFAULT_BRANCH" "$NP_REF") \
             || [ -z "$merge_base" ]; then
            echo "::notice::no usable base revision (event=$NP_EVENT, ref=$NP_REF, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(scripts/ci-changed-scope.sh --resolve-base windows-ci.yml "$merge_base" \
                   "$NP_EVENT" "$NP_HEAD" "$NP_HEAD_BRANCH" "$NP_DEFAULT_BRANCH" "$NP_HEAD_REPO" "$NP_REPO")
          git diff --name-only "${base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  windows-build-test:
    name: dotnet test — NeurOne.Tests
    runs-on: windows-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: ./.github/actions/setup-toolchain
        with:
          dotnet: 'true'

      # `sync-socket-map.ts --check` (generated lattice freshness, SocketLattice.generated.cs
      # included) runs in web-ci.yml on Linux. It is NOT run here: a Windows checkout converts
      # line endings, so every generated file reads as stale.

      # The compiler is the shared Rust NPPS core (common/npps-ffi, OI-NPPS-CORE-01), called through
      # P/Invoke. NeurOne.csproj copies neurone_npps_ffi.dll beside the assembly when this build made it.
      - name: Build the NPPS core (Rust cdylib)
        run: cargo build --release --locked --manifest-path common/Cargo.toml -p neurone-npps-ffi

      - name: Restore
        run: dotnet restore app/windows/NeurOne.Tests/NeurOne.Tests.csproj

      - name: Build
        run: dotnet build app/windows/NeurOne.Tests/NeurOne.Tests.csproj --no-restore

      - name: Test
        run: dotnet test app/windows/NeurOne.Tests/NeurOne.Tests.csproj --no-build --logger "trx;LogFileName=windows-tests.trx"

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: app/windows/NeurOne.Tests/TestResults/
          if-no-files-found: ignore
