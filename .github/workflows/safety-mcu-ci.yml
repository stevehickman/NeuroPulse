name: Safety MCU CI (STM32G071, Class C)

# SW-01 Class C — the firmware that owns every stimulation enable GPIO.
# Its own workflow rather than a matrix leg so its build status is a single
# named check rather than something you read out of a mixed-class matrix
# (NP-SW-CI-001 §5, OI-SWCI-03).
#
# Self-contained by construction: native host tests THEN the cross-compile,
# in one file, because `needs:` only works within a single workflow
# (NP-SW-CI-001 §5.0.1).  Crossing workflow boundaries would mean
# `workflow_run`, which only fires on the default branch, runs in base-repo
# context, and does not attach cleanly to a pull request's check list.
#
# ── Host-test targets owned by this workflow (6 of the repo's 25) ─────────────
# Absorbed from the retired firmware-host-tests.yml (OI-SWCI-09).  These are
# the firmware/safety_mcu/ targets registered by the NP_BUILD_TESTS branch of
# firmware/CMakeLists.txt:
#   np_safety_spi_proto_tests     (OI-SW01-M07-01)
#   np_charge_monitor_tests       (OI-CHARGE-01)
#   np_thermal_interlock_tests    (SW01-M04 NTC cutoff, NP-HW-HUB-001 §7.2)
#   np_impedance_report_tests     (OI-CVNS-HUB-11)
#   np_fault_latch_privacy_tests  (fault-latch privacy gate)
#   np_cardiac_interlock_tests    (SW01-M05 Class C cardiac interlock)
#
# The remaining 19 belong to firmware-cross-build.yml.  6 + 19 = 25, disjoint;
# build-all.yml re-checks that partition every week so the split cannot rot
# into lost coverage.
#
# ── Scoping: why there is no `paths:` filter here any more ────────────────────
# NP-SW-CI-001 §5.0 still governs: this workflow triggers on what it actually
# builds, NOT on `firmware/**`.  What changed at phase 6 (§6.7) is WHERE that
# decision is made.
#
# A workflow-level `paths:` filter suppresses the whole workflow, so on an
# unrelated PR these checks never report at all — and a REQUIRED status check
# that never reports renders as "Expected — waiting for status" and blocks the
# pull request forever.  For the Class C firmware, which owns every stimulation
# enable GPIO, being requirable is the point of phase 6.
#
# The relevance list therefore moved into the `changes` job below, which diffs
# against the merge base and exposes a boolean the other jobs gate on with
# `if:`.  Out-of-scope jobs now report `skipped`, which DOES satisfy a required
# check, instead of not reporting at all.  The build surface is unchanged.
# One list now, not two kept identical by hand.
#
# firmware/crypto/** is still listed because np_crypto is linked into
# np_safety_mcu (see firmware/safety_mcu/CMakeLists.txt) and is recorded as
# Class C as well as Class B — a change there can genuinely break this build.
# Dependencies count; proximity in the tree does not.  That reasoning is now
# ASSERTED as well as stated: the "Scope assertions" step fails this job if a
# crypto-only change is ever judged out of scope here.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege.  Required for actions/checkout, which hard-fails without it
# once the repository is private.  Matches every other workflow in the repo.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

env:
  # The six Class C host-test targets, as a ctest -R regex, and the count they
  # must select.  The count assertion is the point: a silently-shrinking test
  # selection is the OI-SWCI-09 failure mode, and `ctest` exits 0 on a subset
  # just as happily as on the whole suite.
  NP_SAFETY_TESTS: '^np_(safety_spi_proto|charge_monitor|thermal_interlock|impedance_report|fault_latch_privacy|cardiac_interlock|hal_platform)_tests$'
  # The count lives here and in the assertion step — and NOT in the `host-tests`
  # job `name:`, which is what a required status check matches on.  The job used
  # to be called "Safety MCU host tests (6 targets)".  A required context is an
  # exact string match, so the phase that adds a seventh Class C target would
  # have renamed the check and silently stopped satisfying the requirement — a
  # merge deadlock with no error message anywhere.  The Class B side had the
  # same defect with a count that has already moved three times.  The number
  # belongs to the assertion, not to the check name.  NP-SW-CI-001 §6.7.
  #
  # PHASE 7 MOVED THIS 6 → 7, and the design above is what made that a one-line
  # change: np_hal_platform_tests is the seventh Class C target (the SW-01
  # platform layer's own behavioural suite).  Had the count lived in the job
  # `name:`, this edit would have renamed a required status-check context and
  # silently un-gated the branch — the exact merge deadlock §6.7 predicted.
  # build-all.yml's NP_SAFETY_TEST_COUNT and NP_TOTAL_TEST_COUNT (28) move with it.
  NP_SAFETY_TEST_COUNT: '7'

jobs:
  # The relevance list that used to live in `on: … paths:`.  Always runs, always
  # reports (§6.7).
  changes:
    name: Class C scope
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      # ── THE Class C RELEVANCE LIST ────────────────────────────────────────
      # Same 5 entries the retired `paths:` blocks carried, plus the matcher
      # itself, so a change to the matcher re-runs what it gates.  Blank lines
      # and `#` comments are stripped by ci-changed-scope.sh.
      #
      # firmware/crypto/** is present ON PURPOSE — np_crypto links into
      # np_safety_mcu.  See the header, and the "Scope assertions" step below.
      NP_SCOPE_PATHS: |
        firmware/safety_mcu/**
        firmware/crypto/**
        firmware/cmake/stm32g071.cmake
        firmware/CMakeLists.txt
        .github/workflows/safety-mcu-ci.yml
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the matcher diffs against the merge base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      # A broken matcher would skip every Class C job while every check went
      # green — a gate that reports success having verified nothing, on the
      # software that owns every stimulation enable GPIO.  Its unit assertions
      # run before it is trusted, on every invocation.
      - name: Matcher self-test
        run: scripts/ci-changed-scope.sh --self-test

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      # Assert THIS list, not just the matcher: the §5.0 dependency reasoning
      # (crypto in, bootloader out) is executable here rather than only written
      # down in the header.
      # A well-formed pattern that matches nothing is a typo, not a scope
      # decision: `firmware/bootlaoder/**` would silently take the module out
      # of scope and every firmware job would skip while every check went green.
      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Scope assertions
        run: |
          set -euo pipefail
          assert() { # <expected> <path>
            printf '%s\n' "$2" > .scope-probe
            got=$(scripts/ci-changed-scope.sh --relevant scope.paths .scope-probe)
            if [ "$got" != "$1" ]; then
              echo "::error::Class C scope assertion failed: '$2' expected relevant=$1, got $got"
              exit 1
            fi
            echo "ok: $2 → $got"
          }
          assert true  firmware/safety_mcu/src/np_gpio_mgr.c
          assert true  firmware/crypto/np_sha256.c
          assert false firmware/bootloader/src/np_main.c
          assert false docs/np_sw_ci_001.md

      - name: Changed files
        id: diff
        env:
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fail-safe direction is BUILD.  Anything that leaves the scope of the
          # change genuinely unknown is treated as in scope rather than skipped:
          # skipping on uncertainty is how a gate becomes a no-op without anyone
          # noticing.  But "unknown" must mean actually unknown — see below.
          base=""
          if [ -n "${NP_BASE:-}" ] && [ "${NP_BASE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${NP_BASE}^{commit}" 2>/dev/null; then
            base="${NP_BASE}"
          elif [ "${{ github.event_name }}" = "push" ] \
               && git cat-file -e "origin/${NP_DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
            # A branch's FIRST push carries an all-zero `before`, so the naive
            # fail-safe ran a full firmware build on every new branch regardless
            # of what it touched — a §5.0 regression introduced by this very
            # change.  Measured on the phase-6 scratch PR (§6.7) before this
            # branch existed: the pull_request event skipped correctly while the
            # push event for the same commit built everything.  Scoping against
            # the default branch is both correct and cheaper.
            echo "::notice::no usable event base — scoping against origin/${NP_DEFAULT_BRANCH}"
            base="origin/${NP_DEFAULT_BRANCH}"
          fi
          # workflow_dispatch deliberately gets NO fallback.  A human asked for
          # this run, and on the default branch a default-branch fallback would
          # diff main against itself, find nothing, and skip every job — turning
          # the manual "build it now" button into a no-op.
          if [ -z "${base}" ] || ! git cat-file -e "${NP_HEAD}^{commit}" 2>/dev/null; then
            echo "::notice::no usable base revision (event=${{ github.event_name }}, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! merge_base=$(git merge-base "${base}" "${NP_HEAD}"); then
            echo "::notice::no merge base between ${base} and ${NP_HEAD} — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${merge_base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${merge_base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  host-tests:
    name: Safety MCU host tests (Class C)
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    needs: changes
    # Skip ONLY on a definite negative.  `!= 'false'` rather than `== 'true'`:
    # if the `changes` job errors, its output is empty and this job runs anyway.
    # `!cancelled()` is required so a failed `changes` job does not silently
    # skip this one.  See firmware-cross-build.yml for the full reasoning.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    # Deliberately NOT continue-on-error.  These six targets were a blocking
    # check under firmware-host-tests.yml; Phase 0's reporting-only mandate
    # covers the NEW cross-compile verification below, not the coverage this
    # workflow absorbed.  Downgrading them here would be a silent regression.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc

      # Configured from the firmware super-project, not from firmware/safety_mcu
      # directly: the six add_test() registrations live in the NP_BUILD_TESTS
      # branch of firmware/CMakeLists.txt, while firmware/safety_mcu/CMakeLists.txt
      # only add_executable()s them.  Pointing cmake at the subdirectory would
      # build six binaries and register zero ctest tests.
      - name: Configure (host test build)
        run: |
          cmake -B build/host-tests \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNP_BUILD_TESTS=ON \
                -DCMAKE_CROSSCOMPILING=OFF \
                firmware

      - name: Build
        run: cmake --build build/host-tests

      # Guard against selection drift before running anything: if the regex
      # stops matching the six targets — renamed target, deleted test, typo —
      # this fails loudly instead of reporting green over a shrunken suite.
      - name: Assert test selection covers all 6 targets
        run: |
          ctest --test-dir build/host-tests -N -R "$NP_SAFETY_TESTS" | tee selection.txt
          selected=$(sed -n 's/^Total Tests: //p' selection.txt)
          echo "selected=${selected} expected=${NP_SAFETY_TEST_COUNT}"
          if [ "${selected}" != "${NP_SAFETY_TEST_COUNT}" ]; then
            echo "::error::ctest selection drift — expected ${NP_SAFETY_TEST_COUNT} safety-MCU targets, matched ${selected}."
            exit 1
          fi

      - name: Run tests
        run: |
          ctest --test-dir build/host-tests \
                -R "$NP_SAFETY_TESTS" \
                --output-on-failure --no-tests=error

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safety-mcu-host-test-results
          path: build/host-tests/
          retention-days: 7

  cross-build:
    # THE NAME NOW UNDERCLAIMS, AND IS KEPT ANYWAY — read this before "fixing" it.
    #
    # It was "Compile" and not "Build" deliberately, because until phase 7 this
    # leg proved every Class C translation unit compiled for STM32G071 and NOT
    # that a linkable image existed — it did not (Defect E, §4.4).  Phase 7
    # closed Defect E: the leg now LINKS np_safety_mcu.elf and reports its size.
    #
    # The honest name would now be "Cross-build".  Renaming it is deliberately
    # NOT done here, because this string is a required-status-check context
    # (§6.7.8, OI-SWCI-26): a required context is an exact string match whose
    # mismatch produces no error anywhere — the check simply never satisfies and
    # every PR waits forever.  Underclaiming in a job name is a documentation
    # cost; un-gating the branch that guards every stimulation enable GPIO is a
    # safety cost.  The rename is a coordinated change — edit this line and the
    # `Safety` ruleset in the same operation — and is tracked as OI-SWCI-36.
    name: Cross-compile (STM32G071, Cortex-M0+, Class C)
    # ⚠ This string is a required-status-check CONTEXT (NP-SW-CI-001 §6.7.8).
    # Renaming it, or adding a `strategy: matrix:` to this job (which renames
    # the check to "name (value)"), un-gates the branch SILENTLY: the required
    # context stops matching and nothing reports the mismatch. Change it only
    # together with the ruleset.
    runs-on: ubuntu-latest
    # A genuine native counterpart exists for this code, so §5.0.1 applies:
    # do not spend runner minutes cross-compiling what already failed natively.
    needs: [changes, host-tests]
    # `needs.host-tests.result == 'success'` is written out EXPLICITLY rather
    # than left to GitHub's implicit skip-on-failed-need: a custom `if:` that
    # contains a status function (`!cancelled()`) replaces the default
    # `success()`, so without this clause a failed `host-tests` would no longer
    # stop the cross-compile and §5.0.1's ordering rule would be silently gone.
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' && needs.host-tests.result == 'success' }}
    # NOT `continue-on-error` as of phase 4 (NP-SW-CI-001 §6.5).  Defect A is
    # closed — the STM32G0 CMSIS device headers are vendored (firmware/vendor/
    # cmsis_core + cmsis_device_g0, Class C SOUP, anomaly review
    # NP-SOUP-CMSIS-001) — so this leg is green and a regression should turn the
    # run red rather than be masked.
    steps:
      - uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '13.2.Rel1'

      # Pinned rather than `latest` so a toolchain change is a reviewable commit
      # and not an unexplained red build.  Must satisfy the
      # NP_ARM_GCC_MIN_VERSION 12.3 gate in firmware/cmake/arm-none-eabi.cmake.
      - name: Record toolchain version
        run: arm-none-eabi-gcc --version

      - name: Configure
        run: |
          cmake -B build/safety-mcu -G Ninja \
                -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/firmware/cmake/stm32g071.cmake \
                -DCMAKE_BUILD_TYPE=Release \
                firmware/safety_mcu

      # Two steps since phase 7, and the split is deliberate rather than
      # redundant: `np_safety_mcu_objs` and `np_safety_mcu` are two distinct
      # requirement rows in §8's traceability matrix ("compiles for STM32G071"
      # and "links into an image"), and keeping them as separate steps means a
      # break is attributable to one or the other from the step name alone.
      #
      #   np_safety_mcu_objs  every Class C TU — application modules AND the
      #                       platform layer — compiled under -Wall -Wextra
      #                       -Werror.  Gating since phase 4 (§6.5); the property
      #                       Defect A broke.
      #   np_safety_mcu       the linked image.  Gating since PHASE 7.  Until
      #                       then it could not succeed — Defect E (§4.4,
      #                       OI-SWCI-17) left 24 first-party np_hal_* platform
      #                       symbols undefined — and §6 refused to gate a
      #                       permanently red leg.  OI-SWCI-17 is now closed.
      #
      # Not piped through `tail`/`grep`: `cmd | tail` reports tail's exit status,
      # which masked a failure during the §3 measurements.
      - name: Compile (all Class C translation units)
        run: cmake --build build/safety-mcu --target np_safety_mcu_objs

      - name: Link (np_safety_mcu image)
        run: cmake --build build/safety-mcu

      # RESTORED AT PHASE 7 (§6, "both return at phase 7") — with the defect that
      # retired it designed out.
      #
      # The step this replaces was `find … -name '*.elf' | xargs -r arm-none-eabi-size`.
      # `find` matching nothing, piped to `xargs -r`, EXITS 0: a step that always
      # passes while proving nothing, which is why phase 4 deleted it outright
      # rather than leaving it over a non-existent image.  Restoring that shape
      # verbatim would restore the defect — and it would have fired immediately,
      # because CMake gives a cross-compiled executable no suffix by default, so
      # the target produced a file literally named `np_safety_mcu` while every
      # document called it `np_safety_mcu.elf`.  Phase 7 sets SUFFIX ".elf" in
      # firmware/safety_mcu/CMakeLists.txt AND asserts the count here.  Either
      # alone would have been a single point of silent failure.
      #
      # (The same latent defect is still live on the Class B leg: np_bootloader
      # sets no suffix either, so firmware-cross-build.yml's `Report image size`
      # step has been reporting on zero files since it was written — OI-SWCI-35.)
      - name: Report image size
        run: |
          set -euo pipefail
          # POSIX-portable rather than `mapfile`/`stat -c`: both are fine on
          # ubuntu-latest but neither exists on macOS bash 3.2, and every
          # assertion in this file was run locally before being committed.
          # A step that can only be executed by the runner cannot be tested
          # before it gates.
          find build/safety-mcu -name 'np_safety_mcu.elf' -type f > /tmp/np-elves.txt
          n=$(wc -l < /tmp/np-elves.txt | tr -d ' ')
          echo "matched ${n} image(s):"; cat /tmp/np-elves.txt
          if [ "${n}" -ne 1 ]; then
            echo "::error::expected exactly 1 np_safety_mcu.elf, found ${n} — the link did not produce the documented artifact."
            exit 1
          fi
          elf=$(cat /tmp/np-elves.txt)
          arm-none-eabi-size "$elf"
          # Non-trivial size: a 0-byte or few-hundred-byte ELF would satisfy a
          # bare existence check while carrying no firmware.
          bytes=$(wc -c < "$elf" | tr -d ' ')
          echo "elf file size: ${bytes} bytes"
          [ "${bytes}" -gt 4096 ] || { echo "::error::np_safety_mcu.elf is ${bytes} bytes — implausibly small for the Class C image."; exit 1; }

      # Region overflow is already a hard link error (the MEMORY block in
      # startup/stm32g071_flash.ld), and .data+.bss growing into the stack is an
      # ASSERT in that script — both fail the link, which fails the step above.
      # This step covers what neither catches: silent GROWTH toward those walls.
      # A Class C image at 95% of flash still links, and the first anyone would
      # know is a failed build after the next feature. Budgets are deliberately
      # generous (measured 2026-08-11: 35,960 B flash = 27.4%, 824 B SRAM = 2.2%)
      # so this is a tripwire, not a straitjacket.
      - name: Assert image fits its budgets
        run: |
          set -euo pipefail
          elf=build/safety-mcu/np_safety_mcu.elf
          read -r text data bss _ < <(arm-none-eabi-size "$elf" | tail -1)
          flash=$(( text + data ))
          sram=$(( data + bss ))
          # STM32G071KB: 128 KB flash, 36 KB SRAM less the 64-byte fault latch.
          flash_max=$(( 128 * 1024 ))
          sram_max=$(( 36 * 1024 - 64 ))
          echo "flash ${flash}/${flash_max} B   sram ${sram}/${sram_max} B"
          [ "$flash" -le $(( flash_max * 80 / 100 )) ] || { echo "::error::flash ${flash} B exceeds 80% of ${flash_max} B."; exit 1; }
          [ "$sram"  -le $(( sram_max  * 50 / 100 )) ] || { echo "::error::static SRAM ${sram} B exceeds 50% of ${sram_max} B — stack headroom is shrinking."; exit 1; }

      # The link proves the symbols resolve; this proves they resolve to the
      # PLATFORM LAYER and not to anything else.  np_safety_hal.h rule 2: the
      # host-test doubles are an ABI-compatible definition set for exactly these
      # symbols, i.e. the shortest path to a green, useless link.  Nothing in
      # CMake prevents someone adding tests/ to the firmware target; this does.
      - name: Assert no test double reached the image
        run: |
          set -euo pipefail
          map=build/safety-mcu/np_safety_mcu.map
          if grep -qE '(^|/)tests/[A-Za-z0-9_]+\.c\.obj' "$map"; then
            echo "::error::a file from tests/ is linked into the Class C image — see np_safety_hal.h rule 2."
            grep -nE '(^|/)tests/[A-Za-z0-9_]+\.c\.obj' "$map" | head
            exit 1
          fi
          echo "ok: no tests/ object in the image"
          undef=$(arm-none-eabi-nm -u "build/safety-mcu/np_safety_mcu.elf" | grep -c 'np_hal_' || true)
          echo "undefined np_hal_* symbols: ${undef} (was 24 before phase 7)"
          [ "${undef}" -eq 0 ] || { echo "::error::${undef} np_hal_* symbols are still undefined."; exit 1; }

      - name: Upload map and logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safety-mcu-build
          path: |
            build/safety-mcu/**/*.map
            build/safety-mcu/**/CMakeFiles/*.log
          retention-days: 7
          if-no-files-found: ignore
