name: Tooling CI (scripts, doc naming, simulator, python, consent, redaction)

# The code surfaces NP-SW-CI-001 left uncovered.
#
# Phases 1-7 closed the firmware side completely: safety-mcu-ci.yml (Class C),
# firmware-cross-build.yml (Class B + ARM cross-compile), build-all.yml (the
# unscoped weekly backstop). Running the repo's own matcher over the relevance
# lists of every workflow afterwards leaves 65 tracked code files that no build
# or test job touches at all:
#
#   editscripts/*.py            46   one-off document patch/scan scripts
#   simulator/js/**/*.js         9   browser ES modules
#   simulator/server/index.js    1   Node CommonJS WebSocket server
#   scripts/*.ts                 6   generators, analysis, and two GUARDS
#   scripts/*.py                 2   document generators
#   generate_privacy_report.py   1
#
# The sharp end is `scripts/`. web-ci.yml runs with `working-directory: app/web`
# and that tsconfig is `"include": ["src"]`, so scripts/ has never been
# type-checked by anything. The scripts that appear in web-ci's relevance list
# are covered only in the sense that they are EXECUTED as steps; the six that
# are not executed had no build, no check, no type-check. Two of those six are
# themselves guards — check-doc-filenames.ts enforces NP-CONV-001 §4.0 across
# the whole document set, and nothing ran it.
#
# ── What each job proves, stated narrowly ─────────────────────────────────────
# These are cheap gates, and cheap gates earn trust only by being honest about
# their reach:
#
#   scripts    tsc --noEmit over scripts/**/*.ts. Type correctness and nothing
#              else. NOT behaviour: nothing here executes the generators.
#   gate-cov   check-gate-coverage.ts: every gate in scripts/ and ci/ declares
#              its kind, names the population it scans, and has a falsification
#              that a workflow actually runs. A meta-gate over CI itself, so its
#              list is scripts/ + ci/ + EVERY workflow — see Scoping.
#   doc-naming check-doc-filenames.ts run as a real gate: NP-CONV-001 §4.0 over
#              the whole document set, both directions. Its own job with its own
#              relevance list — see Scoping.
#   simulator  Each file parses, in the module system it is actually loaded in.
#              Nothing more. No lint, no types, no runtime.
#   python     Each file compiles to bytecode. Syntax only.
#   consent    Every ConsentStore method on both platforms has the caller its
#              declaration claims. Reachability only — it says nothing about
#              whether the consent logic is correct, which the unit tests cover
#              and which is precisely what did NOT catch the Rev 37 defect.
#
# Syntax and type gates are not a substitute for tests. They are the difference
# between "this file has never been checked by any automation" and "this file at
# least parses and type-checks", on 65 files that were in the first category.
#
# ── Scoping ───────────────────────────────────────────────────────────────────
# No `paths:` filter, for the NP-SW-CI-001 §6.7 reason: a workflow suppressed by
# `paths:` never reports, and a required check that never reports renders as
# "Expected — waiting for status" and blocks the PR forever. The relevance lists
# live in the `changes` job and the jobs gate on `if:`, so an out-of-scope job
# reports `skipped`, which satisfies a required check.
#
# The document-naming guard has its OWN job and its OWN list, and that list
# carries `docs/**` — a second NP-SW-CI-001 §5.0 accepted exception, alongside
# web-ci.yml's section-ref guard, for the identical reason: a guard that cannot
# see the edit that breaks it is not a guard. check-doc-filenames.ts scans every
# .md/.docx/.pdf in docs/ and docs/superseded/, so the only change that can
# violate either half of §4.0 is a document added, renamed or moved — and no list
# in this workflow could see one. Measured on PR #306, a docs-only PR adding five
# files under docs/reference/: the guard's job skipped.
#
# It is a separate job rather than an entry on NP_SCOPE_SCRIPTS because the two
# surfaces genuinely differ. `tsc -p tsconfig.scripts.json` is broken by edits to
# scripts/**, and by nothing under docs/; the naming guard is broken by edits to
# docs/**, and by nothing else in scripts/ but its own source. Merging the lists
# would drag a type-check over every docs commit to buy nothing.
#
# The gate-coverage meta-gate is scoped the same way, and it is NOT a §5.0
# exception — `ci/**` and `.github/workflows/**` are precisely what it reads, so
# listing them is build-only-what-changed, not a departure from it. It shipped on
# NP_SCOPE_SCRIPTS, which sees neither: a new `ci/test_*.py` with no CI-Kind, or
# a workflow edit that drops the step running a gate, is exactly what this gate
# exists to catch and exactly what it could not see. Same defect shape as the
# doc-naming one above, one surface over.
#
# `docs/**` is deliberately NOT on the gate-coverage list, though its population
# probe does run check-doc-filenames.ts against the real tree and would fail if
# the document set were bad. That failure is a consequence, not a detection: any
# change that makes a gate G red is in scope for G's OWN job, which reports it in
# G's own words. Adding docs/** here would fail two jobs for one violation, one
# of them with the wrong message.

on:
  push:
  pull_request:
  workflow_dispatch:

# Least privilege. Required for actions/checkout, which hard-fails without it
# once the repository is private. Matches every other workflow in the repo.
permissions:
  contents: read

jobs:
  changes:
    name: Relevance
    runs-on: ubuntu-latest
    outputs:
      scripts: ${{ steps.scope.outputs.scripts }}
      gatecov: ${{ steps.scope.outputs.gatecov }}
      docnaming: ${{ steps.scope.outputs.docnaming }}
      simulator: ${{ steps.scope.outputs.simulator }}
      python: ${{ steps.scope.outputs.python }}
      consent: ${{ steps.scope.outputs.consent }}
      redaction: ${{ steps.scope.outputs.redaction }}
    env:
      # Seven independent surfaces, seven lists. A simulator-only change should
      # not run the Python gate, and vice versa. Blank lines and `#` comments
      # are stripped by ci-changed-scope.sh, so reasoning lives beside entries.
      NP_SCOPE_SCRIPTS: |
        scripts/**
        tsconfig.scripts.json
        package.json
        bun.lock
        .github/workflows/tooling-ci.yml
      # The gate-coverage meta-gate reads three surfaces and must be triggerable
      # from all three. `ci/**` carries four of the ten gates; every workflow is
      # read to answer "does anything actually RUN this gate, and its self-test?"
      # — so a workflow that quietly drops a step is the edit most worth catching,
      # and NP_SCOPE_SCRIPTS could see none of it. `.github/workflows/**` also
      # subsumes this file, so it is not listed twice.
      NP_SCOPE_GATECOV: |
        scripts/**
        ci/**
        .github/workflows/**
      # The document-naming guard, on its own list. `docs/**` is the whole point:
      # the edit that breaks NP-CONV-001 §4.0 is a document added, renamed or
      # moved, and no other list in this file can see one. The matcher's
      # `prefix/**` shape makes `docs/**` cover `docs/superseded/**` too, which
      # is the second directory the guard scans — asserted below rather than
      # assumed. Deliberate NP-SW-CI-001 §5.0 exception; see the header.
      NP_SCOPE_DOCNAMING: |
        docs/**
        scripts/check-doc-filenames.ts
        .github/workflows/tooling-ci.yml
      NP_SCOPE_SIMULATOR: |
        simulator/**
        # The checker itself lives under scripts/**, which is already listed,
        # but naming it here keeps the dependency legible rather than incidental.
        scripts/check-js-syntax.sh
        .github/workflows/tooling-ci.yml
      NP_SCOPE_PYTHON: |
        editscripts/**
        generate_privacy_report.py
        # scripts/ carries create_np_db_005.py and create_tool_shell_001.py.
        # The matcher supports `prefix/**` and exact paths only — no `*.py`
        # glob — so the directory is listed and the job compiles what it finds.
        scripts/**
        .github/workflows/tooling-ci.yml
      # The consent surface is app code, not tooling, so it needs its own list:
      # scope.scripts.paths cannot see app/**, and the regression this guards
      # against is the DELETION of a caller in a view file. A guard that cannot
      # see the edit that breaks it is not a guard.
      NP_SCOPE_CONSENT: |
        app/ios/**
        app/android/**
        scripts/check-consent-reachability.ts
        .github/workflows/tooling-ci.yml
      # Firmware, for the same reason: the edit that breaks this guard is a new
      # conditional inside a .c reporting path, or a new status bit in a header.
      NP_SCOPE_REDACTION: |
        firmware/**
        scripts/check-redaction-shape.ts
        .github/workflows/tooling-ci.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history: the matcher diffs against the merge base, which a
          # shallow clone does not contain.
          fetch-depth: 0

      # The matcher decides whether anything runs at all, so a broken matcher
      # would skip every job while every check went green. Its assertions run
      # before it is trusted, on every invocation.
      - name: Matcher self-test
        run: scripts/ci-changed-scope.sh --self-test

      - name: Write the relevance lists
        run: |
          set -euo pipefail
          printf '%s\n' "$NP_SCOPE_SCRIPTS"   > scope.scripts.paths
          printf '%s\n' "$NP_SCOPE_GATECOV"   > scope.gatecov.paths
          printf '%s\n' "$NP_SCOPE_DOCNAMING" > scope.docnaming.paths
          printf '%s\n' "$NP_SCOPE_SIMULATOR" > scope.simulator.paths
          printf '%s\n' "$NP_SCOPE_PYTHON"    > scope.python.paths
          printf '%s\n' "$NP_SCOPE_CONSENT"   > scope.consent.paths
          printf '%s\n' "$NP_SCOPE_REDACTION" > scope.redaction.paths

      # A well-formed pattern that matches nothing is a typo, not a scope
      # decision: `simluator/**` would silently take the whole surface out of
      # scope and every job would skip while every check went green.
      - name: Every relevance pattern still resolves in the tree
        run: |
          set -euo pipefail
          for f in scope.scripts.paths scope.gatecov.paths scope.docnaming.paths scope.simulator.paths scope.python.paths scope.consent.paths scope.redaction.paths; do
            echo "--- $f"
            scripts/ci-changed-scope.sh --check-tree "$f"
          done

      - name: Scope assertions
        run: |
          set -euo pipefail
          assert() { # <list> <expected> <path>
            printf '%s\n' "$3" > .scope-probe
            got=$(scripts/ci-changed-scope.sh --relevant "$1" .scope-probe)
            if [ "$got" != "$2" ]; then
              echo "::error::Tooling scope assertion failed on $1: '$3' expected relevant=$2, got $got"
              exit 1
            fi
            echo "ok: $1 · $3 → $got"
          }
          assert scope.scripts.paths   true  scripts/pbm-optical-psf.ts
          assert scope.scripts.paths   true  tsconfig.scripts.json
          assert scope.scripts.paths   false simulator/js/ui.js
          # The two surfaces NP_SCOPE_SCRIPTS could not see, and which are the
          # whole reason this list exists. The workflow case is the sharp one: a
          # gate stops being run by an edit to the workflow that ran it, and
          # before this list only tooling-ci.yml itself was in scope.
          assert scope.gatecov.paths   true  ci/test_shdr_schema.py
          assert scope.gatecov.paths   true  .github/workflows/web-ci.yml
          assert scope.gatecov.paths   true  scripts/check-gate-coverage.ts
          # docs/** is deliberately absent — see the header. A document that
          # breaks check-doc-filenames.ts also fails doc-naming, which IS in
          # scope for it and says so in that gate's own words.
          assert scope.gatecov.paths   false docs/np_dhf_001.md
          # The §5.0 exception, asserted. The first case is the whole reason this
          # list exists — a docs-only PR MUST run the naming guard, which is what
          # PR #306 did not. The second proves `docs/**` reaches the guard's
          # SECOND scan directory: the matcher's prefix shape covers a nested
          # path, and if that ever stopped holding, half the population would
          # leave scope while the job still reported green.
          assert scope.docnaming.paths true  docs/reference/competitive-position.md
          assert scope.docnaming.paths true  docs/superseded/np_risk_001.docx
          assert scope.docnaming.paths true  scripts/check-doc-filenames.ts
          assert scope.docnaming.paths false app/web/src/main.ts
          assert scope.simulator.paths true  simulator/server/index.js
          assert scope.simulator.paths true  simulator/js/ui.js
          assert scope.simulator.paths false app/web/src/main.ts
          assert scope.python.paths    true  editscripts/fix_risk_table.py
          assert scope.python.paths    true  generate_privacy_report.py
          assert scope.python.paths    false app/web/src/main.ts
          assert scope.consent.paths   true  app/ios/NeurOne/Consent/ConsentStore.swift
          assert scope.consent.paths   true  app/ios/NeurOne/Views/ConsentDashboardView.swift
          assert scope.consent.paths   false simulator/js/ui.js
          assert scope.redaction.paths true  firmware/safety_mcu/src/np_fault_latch.c
          assert scope.redaction.paths true  firmware/hub_control/include/np_hub_config.h
          assert scope.redaction.paths false app/web/src/main.ts

      - name: Changed files
        id: diff
        env:
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Fail-safe direction is RUN. Anything that leaves the scope of the
          # change genuinely unknown is treated as in scope rather than skipped.
          base=""
          if [ -n "${NP_BASE:-}" ] && [ "${NP_BASE}" != "0000000000000000000000000000000000000000" ] \
             && git cat-file -e "${NP_BASE}^{commit}" 2>/dev/null; then
            base="${NP_BASE}"
          elif [ "${{ github.event_name }}" = "push" ] \
               && git cat-file -e "origin/${NP_DEFAULT_BRANCH}^{commit}" 2>/dev/null; then
            # A branch's FIRST push carries an all-zero `before`; scoping against
            # the default branch is both correct and cheaper than running
            # everything on every new branch.
            echo "::notice::no usable event base — scoping against origin/${NP_DEFAULT_BRANCH}"
            base="origin/${NP_DEFAULT_BRANCH}"
          fi
          # workflow_dispatch deliberately gets NO fallback: on the default
          # branch it would diff main against itself and skip every job, turning
          # the manual "run it now" button into a no-op.
          if [ -z "${base}" ] || ! git cat-file -e "${NP_HEAD}^{commit}" 2>/dev/null; then
            echo "::notice::no usable base revision (event=${{ github.event_name }}, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! merge_base=$(git merge-base "${base}" "${NP_HEAD}"); then
            echo "::notice::no merge base between ${base} and ${NP_HEAD} — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "${merge_base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${merge_base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          emit() { # <output-name> <patterns-file>
            if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
              relevant=true
            else
              relevant=$(scripts/ci-changed-scope.sh --relevant "$2" changed.txt)
            fi
            echo "$1=${relevant}" | tee -a "$GITHUB_OUTPUT"
          }
          emit scripts   scope.scripts.paths
          emit gatecov   scope.gatecov.paths
          emit docnaming scope.docnaming.paths
          emit simulator scope.simulator.paths
          emit python    scope.python.paths
          emit consent   scope.consent.paths
          emit redaction scope.redaction.paths

  scripts-check:
    name: scripts/ type-check
    runs-on: ubuntu-latest
    needs: changes
    # Skip ONLY on a definite negative — see firmware-cross-build.yml for the
    # full reasoning on `!= 'false'` and `!cancelled()`.
    if: ${{ !cancelled() && needs.changes.outputs.scripts != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # tsconfig.scripts.json exists because app/web/tsconfig.json structurally
      # cannot cover this: web-ci runs tsc from app/web and that config is
      # `"include": ["src"]`.
      - name: TypeScript type-check (scripts/)
        run: bun x tsc -p tsconfig.scripts.json

      # NOT run here: `check-pbm-power.ts --strict`. Its own header records why —
      # 18 of 20 authored protocols are over budget today, so the gate would fail
      # from its first commit and be disabled. It turns on with the OI-SESPWR-01..03
      # remediation (OI-SESPWR-05). The script is still type-checked above, which
      # is the part that was missing.

  gate-coverage:
    name: every gate declares its kind and is proven to fail
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.gatecov != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `bun install`. The meta-gate imports node builtins only, and its
      # population probe RUNS each gate — measured: every probed gate is clean
      # against an empty node_modules, so the install bought nothing here. If a
      # gate ever grows a dependency the probe fails loudly ("exited N on a clean
      # tree"), which is the direction a missing install should fail in.

      # The meta-gate binds itself, so its falsification runs before it does.
      - name: Gate-coverage self-test
        run: bun scripts/check-gate-coverage.ts --self-test

      # Split out of scripts-check on 2026-09-01. It had ridden NP_SCOPE_SCRIPTS
      # since #299, which is `scripts/**` + this workflow — so a new ci/test_*.py
      # with no CI-Kind, or ANY other workflow dropping the step that runs a
      # gate, was invisible to the one gate whose job is to notice exactly that.
      - name: Every gate declares its kind and is proven to fail
        run: bun scripts/check-gate-coverage.ts
  doc-naming:
    name: document filenames match their serials (NP-CONV-001 §4.0)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docnaming != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # No `bun install`: the checker imports node builtins only and spawns
      # nothing but itself. Same reasoning as consent-reachability below.

      # A real guard that nothing was running, and then a guard that ran only
      # when scripts/ changed — which is never, on the one kind of PR that can
      # break it. It verifies NP-CONV-001 §4.0 over the whole document set:
      # every serialed document's filename matches its serial (A), and every
      # serial-shaped filename belongs to a serialed document (B).
      #
      # Before the guard, the guard's falsification. NP-CONV-001 §4.0.1a said
      # this check "was falsified in both directions" — done by hand, kept
      # nowhere. Now it is an artifact that re-runs.
      - name: Guard self-test (prove rules A and B can fail)
        run: bun scripts/check-doc-filenames.ts --self-test

      - name: Document filenames match their serials (NP-CONV-001 §4.0)
        run: bun scripts/check-doc-filenames.ts

  simulator-syntax:
    name: simulator/ parses (ESM + CJS)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.simulator != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The checker's own assertions run before it is trusted, for the same
      # reason the matcher's do. This one is not theoretical: the obvious form of
      # this gate, `node --check <file>`, exits 0 on a simulator/js file with a
      # hard syntax error appended, because Node parses a path argument as
      # CommonJS. The self-test proves both modes REJECT bad input, so the gate
      # cannot silently become a no-op.
      - name: Checker self-test
        run: scripts/check-js-syntax.sh --self-test

      - name: Parse every tracked simulator JavaScript file
        run: scripts/check-js-syntax.sh

  python-syntax:
    name: python compiles (editscripts, scripts, root)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.python != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Syntax only, and deliberately so. editscripts/ is 46 one-off document
      # patch and scan scripts that have already been run; whether they should be
      # archived rather than kept is a separate decision (see the PR body). Until
      # that is decided they are tracked code, and tracked code that no
      # automation has ever parsed is the gap this closes.
      #
      # -q keeps the log to errors. __pycache__/ is already in .gitignore, so the
      # byte-compilation leaves no tree residue.
      - name: Byte-compile every tracked Python file
        run: |
          set -euo pipefail
          python -m compileall -q \
            editscripts \
            scripts \
            generate_privacy_report.py

  consent-reachability:
    name: consent methods are reachable (CLAUDE.md Rev 37)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.consent != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # This job needs no dependencies — the checker reads source text and
      # spawns nothing — so there is deliberately no `bun install` step.

      - name: Guard self-test (prove the reachability rules can fail)
        run: bun scripts/check-consent-reachability.ts --self-test

      # The defect it exists to catch is invisible everywhere else: a consent
      # method can be correct, tested on both platforms, and called by nothing.
      # Tests prove a method works; only a caller proves it runs.
      - name: Every consent method's declared reachability holds
        run: bun scripts/check-consent-reachability.ts

  redaction-shape:
    name: reporting paths cannot leak a sensitive predicate (§5.1)
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.redaction != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Guard self-test (prove the rule and the extractor can fail)
        run: bun scripts/check-redaction-shape.ts --self-test

      # #272 verified this by hand, once — "0 CARDIAC references survive
      # comment-stripping in the reporting path" — and kept none of it.
      - name: No reporting path varies its shape with a sensitive predicate
        run: bun scripts/check-redaction-shape.ts
