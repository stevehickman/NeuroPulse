name: Web App CI (TypeScript + Vitest)

# Runs on every push or PR that touches the NPPS web editor.
# Steps: type-check → unit tests (vitest) → production build (vite).

on:
  push:
    paths:
      - 'app/web/**'
      - 'locales/**'
      - 'npps/fixtures/**'
      - 'protocols/predefined/**'
      - 'scripts/sync-conditions.ts'
      - 'scripts/sync-locales.ts'
      - 'scripts/sync-socket-map.ts'
      - 'scripts/test-lateralization-audit.sh'
  pull_request:
    paths:
      - 'app/web/**'
      - 'locales/**'
      - 'npps/fixtures/**'
      - 'protocols/predefined/**'
      - 'scripts/sync-conditions.ts'
      - 'scripts/sync-locales.ts'
      - 'scripts/sync-socket-map.ts'
      - 'scripts/test-lateralization-audit.sh'
  workflow_dispatch:

# Least privilege. This job only checks out the repo and type-checks/tests/builds
# it; nothing reads GITHUB_TOKEN, calls the API, or publishes. contents:read is
# what actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

jobs:
  web-ci:
    name: TypeScript type-check + Vitest + Vite build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app/web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Swift/Kotlin/C# condition tables are generated from
      # protocols/predefined/00-conditions.npps. Fail the build if the registry
      # changed without re-running the generator (NP-COND-LINK-001 §5).
      - name: Condition tables in sync with the NPPS registry
        working-directory: .
        run: bun scripts/sync-conditions.ts --check

      # Two checks in one run: the generated socket map must still match the row
      # structure + 00-zones.npps, AND no protocol may name a bare single-hemisphere
      # zone without review. The second exists because zone membership is inclusive
      # (PR #210) — a midline socket belongs to both hemispheres of its lobe, so a
      # single-hemisphere zone leaks cortical energy across the midline
      # (docs/np_opt_psf_001.md §4). Without this step the rule is only enforced by
      # someone remembering to re-run a grep.
      - name: Socket map in sync + no unreviewed lateralized protocols
        working-directory: .
        run: bun scripts/sync-socket-map.ts --check

      # The iOS String Catalog and the web locale copies are both generated from
      # locales/*.json. Without this step, canonical and catalogue drift silently
      # and re-running the generator destroys live data: 26 keys existed only in
      # the committed .xcstrings (18 of them referenced by iOS source), and the
      # NP-HFE-002 rewording of two setup strings had been applied to the
      # generated catalogue only — regenerating would have reverted them to
      # instructing users to listen for a bone-conduction tone the firmware no
      # longer emits (docs/np_fw_za_001.md, NP-HFE-002 §7.2).
      - name: Locale catalogues in sync with canonical locales/*.json
        working-directory: .
        run: bun scripts/sync-locales.ts --check

      - name: Lateralization audit behaves (accept + reject paths)
        working-directory: .
        run: bash scripts/test-lateralization-audit.sh

      - name: TypeScript type-check
        run: bun run tsc --noEmit

      - name: Unit tests (Vitest)
        run: bun run vitest run --reporter=verbose

      - name: Production build
        run: bun run build

      - name: Upload build artifact on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-build-dist
          path: app/web/dist/
          retention-days: 7
