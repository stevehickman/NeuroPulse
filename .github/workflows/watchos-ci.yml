name: watchOS CI (xcodebuild)

# Builds the standalone NeurOneWatch app for the watchOS simulator.
# The project is generated from app/watchos/project.yml via XcodeGen, so the
# spec is the source of truth and a stale committed .xcodeproj cannot drift.
# Since Issue #189 ios-ci.yml does the same, so both Apple targets follow one
# convention: project.yml is committed, the .xcodeproj is not.
# There is no watchOS unit-test target yet, so this is a build gate plus one
# assertion on the built bundle (the localized strings, below).

on:
  push:
    paths:
      - 'app/watchos/**'
      - 'app/NeurOneShared/**'
      # The watch bundles the String Catalog generated from canonical
      # locales/*.json (CLAUDE.md §17.4), so a canonical edit — or a generator
      # change — is a watch build input that touches nothing under app/watchos/.
      - 'locales/**'
      - 'scripts/sync-locales.ts'
      - '.github/workflows/watchos-ci.yml'
  pull_request:
    paths:
      - 'app/watchos/**'
      - 'app/NeurOneShared/**'
      - 'locales/**'
      - 'scripts/sync-locales.ts'
      - '.github/workflows/watchos-ci.yml'
  workflow_dispatch:

# Least privilege. This build gate only checks out the repo and compiles it;
# nothing reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
permissions:
  contents: read

jobs:
  watchos-build:
    name: xcodebuild build — NeurOneWatch
    runs-on: macos-15   # Xcode 16+ with a watchOS simulator SDK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          else
            echo "No Xcode 16 found; using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      # project.yml's preGenCommand, the target's first build phase and the
      # scheme pre-action all shell out to bun, and fail without it.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # MUST run before XcodeGen and before any xcodebuild invocation. The watch
      # bundles the git-ignored app/ios/NeurOne/Localizable.xcstrings; generate
      # the project against a checkout without it and XcodeGen silently drops
      # the Resources entry and collapses knownRegions to en + Base, and the app
      # renders raw keys ("WATCH_RMSSD") off a green build. The preGenCommand
      # runs the same generator; this step keeps the ordering visible here, as
      # the matching step in ios-ci.yml does.
      - name: Generate locale files from canonical locales/*.json
        run: bun scripts/sync-locales.ts

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate NeurOneWatch.xcodeproj from spec
        working-directory: app/watchos
        run: xcodegen generate

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/watchos/NeurOneWatch.xcodeproj \
            -scheme NeurOneWatch

      - name: Install watchOS simulator runtime
        run: |
          for i in {1..3}; do
            echo "Attempt $i to install watchOS simulator runtime..."
            if xcodebuild -downloadPlatform watchOS; then
              echo "Successfully installed watchOS simulator runtime"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Installation failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Failed to install watchOS simulator runtime after 3 attempts"
          exit 1

      - name: Build (watchOS simulator)
        run: |
          xcodebuild build \
            -project app/watchos/NeurOneWatch.xcodeproj \
            -scheme NeurOneWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/watchos-dd \
            CODE_SIGNING_ALLOWED=NO

      # A green build is not evidence the strings shipped: before the catalogue
      # was in the spec this job built green with zero .lproj in the bundle.
      # Assert on the artifact — every canonical locale is bundled, and a key
      # the watch renders resolves to its English text, not to itself.
      - name: Assert the bundle carries the localized strings
        run: |
          set -eu
          APP=build/watchos-dd/Build/Products/Debug-watchsimulator/NeurOneWatch.app
          test -d "$APP" || { echo "::error::$APP was not produced"; exit 1; }
          want=$(ls locales/*.json | grep -v '/_' | wc -l | tr -d ' ')
          got=$(find "$APP" -maxdepth 1 -name '*.lproj' | wc -l | tr -d ' ')
          echo "locales/*.json: $want   bundled .lproj: $got"
          if [ "$got" -ne "$want" ]; then
            echo "::error::NeurOneWatch.app bundles $got .lproj, expected $want (one per locales/*.json)"
            exit 1
          fi
          value=$(plutil -extract WATCH_RMSSD raw -o - "$APP/en.lproj/Localizable.strings")
          expected=$(bun -e 'console.log(JSON.parse(await Bun.file("locales/en.json").text()).WATCH_RMSSD)')
          echo "WATCH_RMSSD -> $value"
          if [ "$value" != "$expected" ]; then
            echo "::error::en WATCH_RMSSD resolves to '$value', expected '$expected'"
            exit 1
          fi
