name: watchOS CI (xcodebuild)

# Builds the standalone NeurOneWatch app for the watchOS simulator.
# The project is generated from app/watchos/project.yml via XcodeGen, so the
# spec is the source of truth and a stale committed .xcodeproj cannot drift.
# Since Issue #189 ios-ci.yml does the same, so both Apple targets follow one
# convention: project.yml is committed, the .xcodeproj is not.
# There is no watchOS unit-test target yet, so this is a build gate plus one
# check on the built bundle: that the String Catalog was compiled into it.

on:
  push:
    paths:
      - 'app/watchos/**'
      - 'app/NeurOneShared/**'
      # The watch bundles app/ios/NeurOne/Localizable.xcstrings, which is
      # generated from locales/*.json and not committed (CLAUDE.md §17). A string
      # edit touches nothing under app/watchos/**, so without these entries a
      # canonical change the watch renders would not run this workflow.
      - 'locales/**'
      - 'scripts/sync-locales.ts'
      - '.github/workflows/watchos-ci.yml'
  pull_request:
    paths:
      - 'app/watchos/**'
      - 'app/NeurOneShared/**'
      - 'locales/**'
      - 'scripts/sync-locales.ts'
      - '.github/workflows/watchos-ci.yml'
  workflow_dispatch:

# Least privilege. This build gate only checks out the repo and compiles it;
# nothing reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
permissions:
  contents: read

jobs:
  watchos-build:
    name: xcodebuild build — NeurOneWatch
    runs-on: macos-15   # Xcode 16+ with a watchOS simulator SDK

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          else
            echo "No Xcode 16 found; using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      # project.yml's preGenCommand and the scheme pre-action both run bun.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # MUST run before `xcodegen generate` and before any xcodebuild call.
      - name: Generate locale files from canonical locales/*.json
        run: bun scripts/sync-locales.ts

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate NeurOneWatch.xcodeproj from spec
        working-directory: app/watchos
        run: xcodegen generate

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/watchos/NeurOneWatch.xcodeproj \
            -scheme NeurOneWatch

      - name: Install watchOS simulator runtime
        run: |
          for i in {1..3}; do
            echo "Attempt $i to install watchOS simulator runtime..."
            if xcodebuild -downloadPlatform watchOS; then
              echo "Successfully installed watchOS simulator runtime"
              exit 0
            fi
            if [ $i -lt 3 ]; then
              echo "Installation failed, retrying in 10 seconds..."
              sleep 10
            fi
          done
          echo "Failed to install watchOS simulator runtime after 3 attempts"
          exit 1

      - name: Build (watchOS simulator)
        run: |
          xcodebuild build \
            -project app/watchos/NeurOneWatch.xcodeproj \
            -scheme NeurOneWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO

      # A green build is not evidence the strings shipped. With no catalogue
      # in Copy Bundle Resources the watch builds cleanly and renders every
      # `String(localized: "WATCH_…")` as its raw key. So this reads the built
      # bundle. For every canonical locale the compiled
      # <locale>.lproj/Localizable.strings must hold the probe key, and its value
      # must equal locales/<locale>.json. Comparing the values proves each table
      # is fed from its own locale file, not from an English fallback.
      - name: Assert the bundle carries the compiled strings
        env:
          APP: build/DerivedData/Build/Products/Debug-watchsimulator/NeurOneWatch.app
          KEY: WATCH_AIRPODS_HINT
        run: |
          set -eu
          test -d "$APP" || { echo "::error::no built app at $APP"; exit 1; }
          n=0
          for json in locales/*.json; do
            loc=$(basename "$json" .json)
            case "$loc" in _*) continue ;; esac
            table="$APP/$loc.lproj/Localizable.strings"
            want=$(bun -e 'const [f, k] = process.argv.slice(1); process.stdout.write(JSON.parse(require("fs").readFileSync(f, "utf8"))[k] ?? "")' "$json" "$KEY")
            test -n "$want" || { echo "::error::$KEY missing from $json"; exit 1; }
            got=$(plutil -extract "$KEY" raw -o - "$table") \
              || { echo "::error::$KEY not compiled into $table"; exit 1; }
            if [ "$got" != "$want" ]; then
              echo "::error::$loc: bundle has '$got', locales/$loc.json has '$want'"
              exit 1
            fi
            n=$((n + 1))
          done
          # All eleven locales are required (CLAUDE.md §17). A count below that
          # means the loop saw fewer locale files, not that the bundle was checked.
          test "$n" -eq 11 || { echo "::error::checked $n locale(s), expected 11"; exit 1; }
          echo "$KEY compiled into all $n locale tables, each matching its locales/*.json value"
