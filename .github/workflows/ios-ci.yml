name: iOS CI (xcodebuild)

# Builds the NeurOne iOS app and runs the NeurOneTests suite.
# Uses the shared NeurOne.xcscheme checked into xcshareddata/.

on:
  push:
    paths:
      - 'app/ios/**'
      - 'app/NeurOneShared/**'
  pull_request:
    paths:
      - 'app/ios/**'
      - 'app/NeurOneShared/**'
  workflow_dispatch:

jobs:
  swiftlint:
    name: SwiftLint — strict
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint --strict
        working-directory: app/ios
        run: swiftlint --strict

  ios-build-test:
    name: xcodebuild test — NeurOne
    runs-on: macos-15   # Xcode 16+ with iOS 18 simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          else
            echo "No Xcode 16 found; using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/ios/NeurOne.xcodeproj \
            -scheme NeurOne

      - name: Install runtime, create simulator, and run tests
        run: |
          # Install the iOS simulator runtime
          xcodebuild -downloadPlatform iOS

          # Newest available iOS runtime (inline python3 -c keeps every line
          # inside the YAML block scalar — a column-0 heredoc would terminate it).
          RUNTIME=$(xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('name','').startswith('iOS') and r.get('isAvailable')]; print(rs[-1]['identifier'] if rs else '')")
          if [ -z "$RUNTIME" ]; then echo "No available iOS runtime found"; exit 1; fi

          # Compatible modern iPhone device type (newest preferred).
          # iOS 16+ needs iPhone 8+, iOS 18+ needs iPhone XS+, iOS 26 needs iPhone 12+.
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c "import json,sys; ts=json.load(sys.stdin)['devicetypes']; prefs=['iPhone 16','iPhone 15','iPhone 14','iPhone 13','iPhone 12','iPhone SE (3rd']; m=[t['identifier'] for p in prefs for t in ts if p in t['name']]; print(m[0] if m else '')")
          if [ -z "$DEVICE_TYPE" ]; then echo "No compatible iPhone device type found"; exit 1; fi

          echo "Runtime:     $RUNTIME"
          echo "Device type: $DEVICE_TYPE"

          # Create a device and capture its UDID (simctl prints UDID on stdout)
          UDID=$(xcrun simctl create "NeurOneCI" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created simulator UDID: $UDID"

          xcodebuild test \
            -project app/ios/NeurOne.xcodeproj \
            -scheme NeurOne \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -resultBundlePath build/ios/TestResults.xcresult
      
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/ios/TestResults.xcresult
          retention-days: 14
