name: iOS CI (xcodebuild)

# Builds the NeuroPulse iOS app and runs the NeuroPulseTests suite.
# Uses the shared NeuroPulse.xcscheme checked into xcshareddata/.

on:
  push:
    paths:
      - 'app/ios/**'
      - 'app/NeuroPulseShared/**'
  pull_request:
    paths:
      - 'app/ios/**'
      - 'app/NeuroPulseShared/**'
  workflow_dispatch:

jobs:
  ios-build-test:
    name: xcodebuild test — NeuroPulse
    runs-on: macos-15   # Xcode 16+ with iOS 18 simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/ios/NeuroPulse.xcodeproj \
            -scheme NeuroPulse

      - name: List available simulators
        run: xcrun simctl list devices available
      
      - name: Install iOS Simulator runtime
        run: |
          # Attempt to download the iOS platform
          if ! xcodebuild -downloadPlatform iOS; then
            echo "Platform download failed, attempting alternative approach..."
            xcrun simctl erase all || true
            xcrun simctl list runtimes
          fi
      
      - name: Create and boot simulator
        run: |
          # Get the latest available iOS runtime
          LATEST_RUNTIME=$(xcrun simctl list runtimes | grep "iOS" | tail -1 | grep -oE "com\.apple\.CoreSimulator\.SimRuntime\.iOS-[0-9]+-[0-9]+" || echo "com.apple.CoreSimulator.SimRuntime.iOS-18-5")
          
          for i in {1..3}; do
            if xcrun simctl create "iPhone 16 Pro" \
              com.apple.CoreSimulator.SimDeviceType.iPhone-16Pro \
              "$LATEST_RUNTIME"; then
              break
            fi
            echo "Attempt $i failed, retrying..."
            sleep 3
          done
          sleep 5
          xcrun simctl boot "iPhone 16 Pro" || true
          sleep 10
      
      - name: Build and test
        run: |
          # Extract OS version from runtime
          OS_VERSION=$(echo "$LATEST_RUNTIME" | grep -oE "[0-9]+-[0-9]+" | tr '-' '.')
          
          xcodebuild test \
            -project app/ios/NeuroPulse.xcodeproj \
            -scheme NeuroPulse \
            -destination "platform=iOS Simulator,name=iPhone 16 Pro,OS=${OS_VERSION}" \
            -resultBundlePath build/ios/TestResults.xcresult
      
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/ios/TestResults.xcresult
          retention-days: 14
