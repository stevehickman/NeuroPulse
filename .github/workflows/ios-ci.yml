name: iOS CI (xcodebuild)

# Builds the NeurOne iOS app and runs the NeurOneTests suite.
# NeurOne.xcodeproj — including the shared NeurOne.xcscheme — is generated from
# app/ios/project.yml via XcodeGen and is not committed (Issue #189), so the
# spec is the source of truth and no tracked project can drift from it.

on:
  # Push only validates the integration branch after merge. Feature branches are
  # covered by pull_request, so a PR branch no longer triggers two runs of the same
  # SHA (which doubled exposure to the CoreSimulator flake below).
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. Both jobs only check out the repo and build/test it; nothing
# reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # Per-commit relevance (NP-SW-CI-001 §6.7). Replaces the `pull_request: paths:`
  # filter, which GitHub evaluates against the WHOLE pull request: once a PR touched
  # one of these paths, every later commit re-ran this workflow, however small. This
  # job diffs from the last green run of this workflow on the branch instead, so a
  # commit that cannot affect the build skips it. A job skipped by `if:` reports
  # `skipped`, which satisfies a required check; a `paths:`-suppressed workflow
  # never reports at all.
  changes:
    name: Relevance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}
    env:
      NP_SCOPE_PATHS: |
        app/ios/**
        app/NeurOneShared/**
        locales/**
        scripts/sync-locales.ts
        protocols/predefined/**
        # The iOS app links the shared NPPS core (OI-NPPS-CORE-01), built from common/ by
        # scripts/build-npps-xcframework.sh, and NppsCoreTests pushes the library and the fixtures through it.
        common/Cargo.toml
        common/Cargo.lock
        common/npps/**
        common/npps-core/**
        common/npps-ffi/**
        scripts/build-npps-xcframework.sh
        npps/fixtures/**
        # HubDescriptorCompilerTests diffs against the web compiler's golden descriptors, which
        # live beside Android's tests and are shared by all three native compilers (OI-AND-WIRE-01).
        app/NeurOneShared/TestData/hub-descriptor-golden.json
        # The serializer and validator are the core's too: the tests push these goldens through the binding.
        app/NeurOneShared/TestData/npps-serialize-golden.json
        app/NeurOneShared/TestData/npps-validate-golden.json
        app/NeurOneShared/TestData/nfkc-corpus.json
        .github/workflows/ios-ci.yml
        scripts/ci-changed-scope.sh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the relevance list
        run: printf '%s\n' "$NP_SCOPE_PATHS" > scope.paths

      - name: Every relevance pattern still resolves in the tree
        run: scripts/ci-changed-scope.sh --check-tree scope.paths

      - name: Changed files
        id: diff
        env:
          NP_EVENT: ${{ github.event_name }}
          NP_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          NP_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          NP_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          NP_REF: ${{ github.ref }}
          GH_TOKEN: ${{ github.token }}
          NP_REPO: ${{ github.repository }}
          NP_HEAD_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          NP_HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
        run: |
          set -euo pipefail
          if ! merge_base=$(scripts/ci-changed-scope.sh --diff-base \
                 "$NP_EVENT" "${NP_BASE:-}" "$NP_HEAD" "$NP_DEFAULT_BRANCH" "$NP_REF") \
             || [ -z "$merge_base" ]; then
            echo "::notice::no usable base revision (event=$NP_EVENT, ref=$NP_REF, base='${NP_BASE:-}') — treating as in scope"
            echo "unknown_base=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=$(scripts/ci-changed-scope.sh --resolve-base ios-ci.yml "$merge_base" \
                   "$NP_EVENT" "$NP_HEAD" "$NP_HEAD_BRANCH" "$NP_DEFAULT_BRANCH" "$NP_HEAD_REPO" "$NP_REPO")
          git diff --name-only "${base}" "${NP_HEAD}" > changed.txt
          echo "unknown_base=false" >> "$GITHUB_OUTPUT"
          echo "--- changed files (base ${base}) ---"
          cat changed.txt

      - name: Relevance
        id: scope
        run: |
          set -euo pipefail
          if [ "${{ steps.diff.outputs.unknown_base }}" = "true" ]; then
            relevant=true
          else
            relevant=$(scripts/ci-changed-scope.sh --relevant scope.paths changed.txt)
            echo "--- in-scope files ---"
            scripts/ci-changed-scope.sh --match scope.paths changed.txt
          fi
          echo "relevant=${relevant}" | tee -a "$GITHUB_OUTPUT"

  swiftlint:
    name: SwiftLint — strict
    runs-on: macos-15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint --strict
        working-directory: app/ios
        run: swiftlint --strict

  ios-build-test:
    name: xcodebuild test — NeurOne
    runs-on: macos-15   # Xcode 16+ with iOS 18 simulator
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relevant != 'false' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          else
            echo "No Xcode 16 found; using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      # The NeurOne target's first build phase generates Localizable.xcstrings
      # from locales/*.json; it fails the build if bun is not on PATH.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # MUST run before any xcodebuild invocation, not merely before the build
      # phase that also generates it. Localizable.xcstrings is git-ignored
      # (CLAUDE.md §17), so on a fresh checkout it does not exist when Xcode
      # computes the build plan — and a file absent at plan time is not compiled
      # into the bundle no matter what a later phase writes there. The target's
      # own run-script phase did run and did generate the catalogue, and the app
      # still shipped with no strings: every String(localized:) returned its raw
      # key, and eight tests failed asserting on rendered text
      # (SOCKET_ERR_UNKNOWN_ZONE, ZONE_ANNOUNCE_WITH_TYPE, …). Generating here
      # puts the file on disk before Xcode looks.
      - name: Generate locale files from canonical locales/*.json
        run: bun scripts/sync-locales.ts

      # app/ios/project.yml's preGenCommand builds NeurOneNppsCore.xcframework from common/npps-ffi
      # (scripts/build-npps-xcframework.sh): three Apple targets, then xcodebuild -create-xcframework.
      - name: Set up Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      - name: Install XcodeGen
        run: brew install xcodegen

      # MUST run after the locale step above and before every xcodebuild
      # invocation. XcodeGen builds the project from what is on disk when it
      # runs, so generating against a checkout without Localizable.xcstrings
      # produces a project with no Resources entry for it and with knownRegions
      # collapsed to en + Base — an app that renders raw keys, in English only,
      # off a green build. app/ios/project.yml's preGenCommand runs the same
      # generator for exactly that reason; this step keeps the ordering visible
      # here too.
      - name: Generate NeurOne.xcodeproj from spec
        working-directory: app/ios
        run: xcodegen generate

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/ios/NeurOne.xcodeproj \
            -scheme NeurOne

      - name: Install runtime, create simulator, and run tests
        run: |
          set -euo pipefail

          # Newest available iOS runtime identifier (inline python3 -c keeps every
          # line inside the YAML block scalar — a column-0 heredoc would terminate it).
          runtime_id() {
            xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('name','').startswith('iOS') and r.get('isAvailable')]; print(rs[-1]['identifier'] if rs else '')"
          }

          # `xcodebuild -downloadPlatform iOS` intermittently dies with
          # "Unable to connect to simulator" (exit 70) — it is the single biggest
          # source of flaky red on this job. The macos-15 image ships an iOS runtime
          # preinstalled, so we only download when none is present, and retry with a
          # CoreSimulator service bounce between attempts when we genuinely must.
          RUNTIME=$(runtime_id || true)
          if [ -z "$RUNTIME" ]; then
            for attempt in 1 2 3; do
              echo "No iOS runtime present — downloadPlatform attempt $attempt…"
              if xcodebuild -downloadPlatform iOS; then break; fi
              echo "Attempt $attempt failed; bouncing CoreSimulator and retrying…"
              sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
              sleep 15
            done
            RUNTIME=$(runtime_id || true)
          fi
          if [ -z "$RUNTIME" ]; then echo "No available iOS runtime found"; exit 1; fi

          # Compatible modern iPhone device type (newest preferred).
          # iOS 16+ needs iPhone 8+, iOS 18+ needs iPhone XS+, iOS 26 needs iPhone 12+.
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c "import json,sys; ts=json.load(sys.stdin)['devicetypes']; prefs=['iPhone 16','iPhone 15','iPhone 14','iPhone 13','iPhone 12','iPhone SE (3rd']; m=[t['identifier'] for p in prefs for t in ts if p in t['name']]; print(m[0] if m else '')")
          if [ -z "$DEVICE_TYPE" ]; then echo "No compatible iPhone device type found"; exit 1; fi

          echo "Runtime:     $RUNTIME"
          echo "Device type: $DEVICE_TYPE"

          # Create the device, retrying with a service bounce — CoreSimulator can be
          # briefly unreachable right after the runner boots (the same exit-70 flake).
          UDID=""
          for attempt in 1 2 3; do
            xcrun simctl list devices >/dev/null 2>&1 || true
            if UDID=$(xcrun simctl create "NeurOneCI" "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null) && [ -n "$UDID" ]; then
              break
            fi
            echo "simctl create attempt $attempt failed; bouncing CoreSimulator…"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 15
          done
          if [ -z "$UDID" ]; then echo "Failed to create simulator"; exit 1; fi
          echo "Created simulator UDID: $UDID"

          # Boot explicitly and wait — surfaces a bad simulator here rather than
          # letting xcodebuild fail opaquely mid-test.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || true

          # No retry on the test command itself — a genuine test failure must stay red.
          xcodebuild test \
            -project app/ios/NeurOne.xcodeproj \
            -scheme NeurOne \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -resultBundlePath build/ios/TestResults.xcresult
      
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/ios/TestResults.xcresult
          retention-days: 14
