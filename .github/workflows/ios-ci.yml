name: iOS CI (xcodebuild)

# Builds the NeurOne iOS app and runs the NeurOneTests suite.
# Uses the shared NeurOne.xcscheme checked into xcshareddata/.

on:
  # Push only validates the integration branch after merge. Feature branches are
  # covered by pull_request, so a PR branch no longer triggers two runs of the same
  # SHA (which doubled exposure to the CoreSimulator flake below).
  push:
    branches: [main]
    paths:
      - 'app/ios/**'
      - 'app/NeurOneShared/**'
      - '.github/workflows/ios-ci.yml'
  pull_request:
    paths:
      - 'app/ios/**'
      - 'app/NeurOneShared/**'
      - '.github/workflows/ios-ci.yml'
  workflow_dispatch:

# Least privilege. Both jobs only check out the repo and build/test it; nothing
# reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

# Cancel superseded runs when new commits land on the same PR/branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    name: SwiftLint — strict
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint --strict
        working-directory: app/ios
        run: swiftlint --strict

  ios-build-test:
    name: xcodebuild test — NeurOne
    runs-on: macos-15   # Xcode 16+ with iOS 18 simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          else
            echo "No Xcode 16 found; using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/ios/NeurOne.xcodeproj \
            -scheme NeurOne

      - name: Install runtime, create simulator, and run tests
        run: |
          set -euo pipefail

          # Newest available iOS runtime identifier (inline python3 -c keeps every
          # line inside the YAML block scalar — a column-0 heredoc would terminate it).
          runtime_id() {
            xcrun simctl list runtimes --json | python3 -c "import json,sys; rs=[r for r in json.load(sys.stdin)['runtimes'] if r.get('name','').startswith('iOS') and r.get('isAvailable')]; print(rs[-1]['identifier'] if rs else '')"
          }

          # `xcodebuild -downloadPlatform iOS` intermittently dies with
          # "Unable to connect to simulator" (exit 70) — it is the single biggest
          # source of flaky red on this job. The macos-15 image ships an iOS runtime
          # preinstalled, so we only download when none is present, and retry with a
          # CoreSimulator service bounce between attempts when we genuinely must.
          RUNTIME=$(runtime_id || true)
          if [ -z "$RUNTIME" ]; then
            for attempt in 1 2 3; do
              echo "No iOS runtime present — downloadPlatform attempt $attempt…"
              if xcodebuild -downloadPlatform iOS; then break; fi
              echo "Attempt $attempt failed; bouncing CoreSimulator and retrying…"
              sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
              sleep 15
            done
            RUNTIME=$(runtime_id || true)
          fi
          if [ -z "$RUNTIME" ]; then echo "No available iOS runtime found"; exit 1; fi

          # Compatible modern iPhone device type (newest preferred).
          # iOS 16+ needs iPhone 8+, iOS 18+ needs iPhone XS+, iOS 26 needs iPhone 12+.
          DEVICE_TYPE=$(xcrun simctl list devicetypes --json | python3 -c "import json,sys; ts=json.load(sys.stdin)['devicetypes']; prefs=['iPhone 16','iPhone 15','iPhone 14','iPhone 13','iPhone 12','iPhone SE (3rd']; m=[t['identifier'] for p in prefs for t in ts if p in t['name']]; print(m[0] if m else '')")
          if [ -z "$DEVICE_TYPE" ]; then echo "No compatible iPhone device type found"; exit 1; fi

          echo "Runtime:     $RUNTIME"
          echo "Device type: $DEVICE_TYPE"

          # Create the device, retrying with a service bounce — CoreSimulator can be
          # briefly unreachable right after the runner boots (the same exit-70 flake).
          UDID=""
          for attempt in 1 2 3; do
            xcrun simctl list devices >/dev/null 2>&1 || true
            if UDID=$(xcrun simctl create "NeurOneCI" "$DEVICE_TYPE" "$RUNTIME" 2>/dev/null) && [ -n "$UDID" ]; then
              break
            fi
            echo "simctl create attempt $attempt failed; bouncing CoreSimulator…"
            sudo killall -9 com.apple.CoreSimulator.CoreSimulatorService 2>/dev/null || true
            sleep 15
          done
          if [ -z "$UDID" ]; then echo "Failed to create simulator"; exit 1; fi
          echo "Created simulator UDID: $UDID"

          # Boot explicitly and wait — surfaces a bad simulator here rather than
          # letting xcodebuild fail opaquely mid-test.
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b || true

          # No retry on the test command itself — a genuine test failure must stay red.
          xcodebuild test \
            -project app/ios/NeurOne.xcodeproj \
            -scheme NeurOne \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -resultBundlePath build/ios/TestResults.xcresult
      
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/ios/TestResults.xcresult
          retention-days: 14
