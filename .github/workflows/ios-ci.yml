name: iOS CI (xcodebuild)

# Builds the NeuroPulse iOS app and runs the NeuroPulseTests suite.
# Uses the shared NeuroPulse.xcscheme checked into xcshareddata/.

on:
  push:
    paths:
      - 'app/ios/**'
      - 'app/NeuroPulseShared/**'
  pull_request:
    paths:
      - 'app/ios/**'
      - 'app/NeuroPulseShared/**'
  workflow_dispatch:

jobs:
  swiftlint:
    name: SwiftLint — strict
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint --strict
        working-directory: app/ios
        run: swiftlint --strict

  ios-build-test:
    name: xcodebuild test — NeuroPulse
    runs-on: macos-15   # Xcode 16+ with iOS 18 simulator

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pick the latest Xcode 16.x available on the runner
          XCODE_PATH=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE_PATH" ]; then
            sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
            echo "Selected: $XCODE_PATH"
          else
            echo "No Xcode 16 found; using default: $(xcode-select -p)"
          fi
          xcodebuild -version

      - name: Resolve Swift Package dependencies
        run: |
          xcodebuild \
            -resolvePackageDependencies \
            -project app/ios/NeuroPulse.xcodeproj \
            -scheme NeuroPulse

      - name: Install runtime, create simulator, and run tests
        run: |
          # Install the iOS simulator runtime
          xcodebuild -downloadPlatform iOS

          # Parse installed runtime and a compatible modern device type from JSON
          eval "$(python3 - <<'EOF'
import json, subprocess, sys

runtimes = json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','--json']))['runtimes']
ios = [r for r in runtimes if r.get('name','').startswith('iOS') and r.get('isAvailable')]
if not ios:
    print('echo "No available iOS runtime found"; exit 1', file=sys.stderr)
    sys.exit(1)
runtime = ios[-1]['identifier']

types = json.loads(subprocess.check_output(['xcrun','simctl','list','devicetypes','--json']))['devicetypes']
# iOS 16+ requires iPhone 8 or newer; iOS 18+ requires iPhone XS or newer;
# iOS 26 requires iPhone 12 or newer. Prefer newer models.
preferred = ['iPhone 16', 'iPhone 15', 'iPhone 14', 'iPhone 13', 'iPhone 12', 'iPhone SE (3rd']
device_type = ''
for pref in preferred:
    matches = [t['identifier'] for t in types if pref in t['name']]
    if matches:
        device_type = matches[0]
        break

if not device_type:
    print('echo "No compatible iPhone device type found"; exit 1')
    sys.exit(1)

print(f'RUNTIME="{runtime}"')
print(f'DEVICE_TYPE="{device_type}"')
EOF
          )"

          echo "Runtime:     $RUNTIME"
          echo "Device type: $DEVICE_TYPE"

          # Create a device and capture its UDID (simctl prints UDID on stdout)
          UDID=$(xcrun simctl create "NeuroPulseCI" "$DEVICE_TYPE" "$RUNTIME")
          echo "Created simulator UDID: $UDID"

          xcodebuild test \
            -project app/ios/NeuroPulse.xcodeproj \
            -scheme NeuroPulse \
            -destination "platform=iOS Simulator,id=${UDID}" \
            -resultBundlePath build/ios/TestResults.xcresult
      
      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: build/ios/TestResults.xcresult
          retention-days: 14
