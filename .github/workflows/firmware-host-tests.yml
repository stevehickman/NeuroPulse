name: Firmware Host Unit Tests

# Builds and runs the five host-native test targets.
# Does NOT require the ARM cross-compiler.
# Modules with NP_BUILD_TESTS host targets:
#   firmware/crypto        → np_crypto_tests   (SHA-256/512, CRC-32, Ed25519)
#   firmware/anon          → np_anon_tests     (Scratch encryption)
#   firmware/edf           → np_edf_tests      (EDF+ privacy header)
#   firmware/factory_reset → np_factory_reset_tests (device reset)
#   firmware/ota           → np_ota_tests      (OTA state CRC + rollback)
#   firmware/safety_mcu    → np_safety_spi_proto_tests, np_charge_monitor_tests
#   firmware/hub_control   → np_cvns_reenable_tests (OI-CVNS-HUB-01)

on:
  push:
    paths:
      - 'firmware/crypto/**'
      - 'firmware/anon/**'
      - 'firmware/edf/**'
      - 'firmware/factory_reset/**'
      - 'firmware/ota/**'
      - 'firmware/safety_mcu/**'
      - 'firmware/hub_control/**'
      - 'firmware/common/**'
      - 'firmware/CMakeLists.txt'
      - 'firmware/cmake/**'
  pull_request:
    paths:
      - 'firmware/crypto/**'
      - 'firmware/anon/**'
      - 'firmware/edf/**'
      - 'firmware/factory_reset/**'
      - 'firmware/ota/**'
      - 'firmware/safety_mcu/**'
      - 'firmware/hub_control/**'
      - 'firmware/common/**'
      - 'firmware/CMakeLists.txt'
      - 'firmware/cmake/**'
  workflow_dispatch:

jobs:
  firmware-host-tests:
    name: CMake host tests (crypto + anon + edf + factory_reset + ota + safety_mcu + hub_control)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc

      - name: Configure (host test build)
        run: |
          cmake -B build/host-tests \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNP_BUILD_TESTS=ON \
                -DCMAKE_CROSSCOMPILING=OFF \
                firmware

      - name: Build
        run: cmake --build build/host-tests

      - name: Run tests
        run: ctest --test-dir build/host-tests --output-on-failure --no-tests=error

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-test-results
          path: build/host-tests/
          retention-days: 7
