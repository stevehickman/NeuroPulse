name: Firmware Host Unit Tests

# Builds and runs the 25 host-native test targets registered by
# firmware/CMakeLists.txt.  Does NOT require the ARM cross-compiler.
# Keep this count and the job `name:` below in step with the add_test() calls
# in firmware/CMakeLists.txt — both said 23 while the tree held 24.
#
# Modules with NP_BUILD_TESTS host targets:
#   firmware/crypto          → np_crypto_tests   (SHA-256/512, CRC-32, Ed25519)
#   firmware/anon            → np_anon_tests     (Scratch encryption)
#   firmware/edf             → np_edf_tests      (EDF+ privacy header)
#   firmware/factory_reset   → np_factory_reset_tests (device reset)
#   firmware/uhdr_key        → np_uhdr_key_tests (two-layer UHDR key, §C)
#   firmware/ota             → np_ota_tests      (OTA state CRC + rollback)
#   firmware/safety_mcu      → np_safety_spi_proto_tests     (OI-SW01-M07-01)
#                            → np_charge_monitor_tests       (OI-CHARGE-01)
#                            → np_thermal_interlock_tests    (SW01-M04 NTC cutoff, §7.2)
#                            → np_impedance_report_tests     (OI-CVNS-HUB-11)
#                            → np_fault_latch_privacy_tests  (fault-latch privacy gate)
#                            → np_cardiac_interlock_tests    (SW01-M05 Class C cardiac interlock)
#   firmware/hub_control     → np_cvns_reenable_tests (OI-CVNS-HUB-01)
#                            → np_log_backend_tests   (OI-LOG-01..04)
#                            → np_transport_tests     (OI-HUB-MAIN-01)
#                            → np_mod_cvns_tests      (hub ↔ CVNS library)
#                            → np_module_map_tests    (hex zone-module addressing/NVRAM map)
#                            → np_protocol_tests      (hub protocol v2 socket-mask targets)
#                            → np_mod_stim_tests      (BES/tACS + tDCS slot dispatch)
#   firmware/zone_announce   → np_zone_announce_tests (module-status frame encoder)
#                            → np_zone_notify_tests   (app-notify dispatch)
#   firmware/pbm_1064nm      → np_pbm1064_session_desc_tests (NP-SES-1064-001 v5 wire format)
#   firmware/cervical_vns    → np_cvns_fai_tests      (FAI CV01..CV06, cardiac interlock)
#   firmware/sloreta_hdtdcs  → np_hd_fai_tests        (FAI HD02/HD05.., montage + sLORETA)
#   firmware/vendor/freertos → np_freertos_smoke_tests (kernel + config, POSIX port)
#
# ── Keeping the `paths:` filters correct ──────────────────────────────────────
# The push: and pull_request: path lists below MUST stay identical to each other
# and MUST cover every module add_subdirectory()'d by the NP_BUILD_TESTS branch
# of firmware/CMakeLists.txt.  A module that is tested but unlisted here builds
# and runs locally while silently having no CI at all.
#
# The duplication is deliberate, not an oversight: the GitHub Actions workflow
# parser does not support YAML anchors/aliases, so `&paths` / `*paths` cannot be
# used to collapse the two lists.  When adding a module, edit BOTH lists.
#
# ── Modules deliberately NOT listed (do not "fix" this) ───────────────────────
# firmware/bootloader and firmware/hrv_biofeedback are absent from the paths
# lists ON PURPOSE.  Read "by the NP_BUILD_TESTS branch" above literally: that
# branch (firmware/CMakeLists.txt:122-242) ends in return(), so every
# add_subdirectory() below line 243 — bootloader and hrv_biofeedback among them —
# is cross-compile-only and is never reached by this workflow's configuration.
# bootloader/CMakeLists.txt:33 hard-errors under `if(NOT CMAKE_CROSSCOMPILING)`
# and requires arm-none-eabi-objcopy/-size, which this runner does not have.
#
# Adding them here would fire a job that returns before compiling them: a green
# check that proves nothing about the code that changed.  That is strictly worse
# than the current honest silence.  An audit that greps ALL add_subdirectory()
# calls rather than only the NP_BUILD_TESTS branch will report these two as
# missing coverage — that audit is wrong, and this note exists because one did.
#
# The real gap they represent is that the repo has NO ARM cross-compile CI job,
# so nothing proves the firmware builds for its target at all.  Closing that is
# a new job, not a paths edit.

on:
  push:
    paths:
      - 'firmware/crypto/**'
      - 'firmware/anon/**'
      - 'firmware/edf/**'
      - 'firmware/factory_reset/**'
      - 'firmware/uhdr_key/**'
      - 'firmware/ota/**'
      - 'firmware/safety_mcu/**'
      - 'firmware/hub_control/**'
      - 'firmware/zone_announce/**'
      - 'firmware/pbm_1064nm/**'
      - 'firmware/cervical_vns/**'
      - 'firmware/sloreta_hdtdcs/**'
      - 'firmware/vendor/**'
      - 'firmware/common/**'
      - 'firmware/CMakeLists.txt'
      - 'firmware/cmake/**'
      - '.github/workflows/firmware-host-tests.yml'
  pull_request:
    paths:
      - 'firmware/crypto/**'
      - 'firmware/anon/**'
      - 'firmware/edf/**'
      - 'firmware/factory_reset/**'
      - 'firmware/uhdr_key/**'
      - 'firmware/ota/**'
      - 'firmware/safety_mcu/**'
      - 'firmware/hub_control/**'
      - 'firmware/zone_announce/**'
      - 'firmware/pbm_1064nm/**'
      - 'firmware/cervical_vns/**'
      - 'firmware/sloreta_hdtdcs/**'
      - 'firmware/vendor/**'
      - 'firmware/common/**'
      - 'firmware/CMakeLists.txt'
      - 'firmware/cmake/**'
      - '.github/workflows/firmware-host-tests.yml'
  workflow_dispatch:

# Least privilege. Every job here only checks out the repo and builds/tests it;
# nothing reads GITHUB_TOKEN, calls the API, or publishes. contents:read is what
# actions/checkout needs and is therefore the complete required scope.
# (actions/upload-artifact authenticates with ACTIONS_RUNTIME_TOKEN, not
# GITHUB_TOKEN, so it needs no `actions:` permission.)
permissions:
  contents: read

jobs:
  firmware-host-tests:
    name: CMake host tests (25 targets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build gcc

      - name: Configure (host test build)
        run: |
          cmake -B build/host-tests \
                -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DNP_BUILD_TESTS=ON \
                -DCMAKE_CROSSCOMPILING=OFF \
                firmware

      - name: Build
        run: cmake --build build/host-tests

      - name: Run tests
        run: ctest --test-dir build/host-tests --output-on-failure --no-tests=error

      - name: Upload test output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-test-results
          path: build/host-tests/
          retention-days: 7
