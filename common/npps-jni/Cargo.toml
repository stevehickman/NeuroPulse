[package]
name = "neurone-npps-jni"
version = "0.1.0"
edition = "2021"
description = "JNI binding of neurone-npps-core for Android and JVM. Marshalling only: the contract is neurone_npps_core::api. OI-NPPS-CORE-01."
publish = false

[lib]
name = "neurone_npps_jni"
crate-type = ["cdylib"]

[features]
# Passes `refuse-hex-keys` to the core (SWR-MG-32 (h)). Off by default.
refuse-hex-keys = ["neurone-npps-core/refuse-hex-keys"]

[dependencies]
neurone-npps-core = { path = "../npps-core" }
jni = "0.21"
# Wipes the copy of the secrets read from a Java array (SWR-MG-32). Already in the tree through the core.
zeroize = "1"
