<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-label="After: app screens and which of them report a screen name to the analytics host"><title>Screens and the analytics host, after OI-PRIV-05</title><style>
.n{fill:#fff;stroke:#c5ccd6;stroke-width:1}.n.ok{fill:#e6f0f7;stroke:#1d5f8a}.n.leak{fill:#fbe9e7;stroke:#b3261e}
.tab{fill:#18212b}.tt{fill:#f7f8fa;font:600 13px system-ui,sans-serif}
.t{fill:#18212b;font:500 12.5px system-ui,sans-serif}.s{fill:#5b6876;font:400 11.5px system-ui,sans-serif}
.h{fill:#5b6876;font:600 11px system-ui,sans-serif;letter-spacing:.08em}.pt{fill:#18212b;font:600 13.5px system-ui,sans-serif}
.tl{fill:#b3261e;font:500 11.5px ui-monospace,Menlo,monospace}.tk{fill:#1d5f8a;font:500 11.5px ui-monospace,Menlo,monospace}
.ar{stroke:#5b6876;stroke-width:1.2;fill:none}.ah{fill:#5b6876}.rail{stroke:#c5ccd6;stroke-width:1;stroke-dasharray:4 4}
.uh{fill:#eef2f6;stroke:#c5ccd6}.who{fill:#fff;stroke:#c5ccd6}.an{fill:#fff;stroke:#1d5f8a;stroke-width:1.5}.bar{stroke:#18212b;stroke-width:3}
</style><rect x="0" y="0" width="1040" height="690" fill="#ffffff"/><defs><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" class="ah"/></marker></defs><text class="h" x="20" y="22">FIRST RUN</text><rect class="n" x="20" y="34" width="230" height="46" rx="6"/><text class="t" x="30" y="62">Age gate</text><line class="ar" x1="254" y1="57" x2="286" y2="57" marker-end="url(#ac)"/><rect class="n" x="290" y="34" width="230" height="46" rx="6"/><text class="t" x="300" y="62">Biometric disclosure</text><line class="ar" x1="524" y1="57" x2="556" y2="57" marker-end="url(#ac)"/><rect class="n" x="560" y="34" width="230" height="46" rx="6"/><text class="t" x="570" y="62">Research consent (first run)</text><line class="ar" x1="794" y1="57" x2="834" y2="57" marker-end="url(#ac)"/><text class="t" x="844" y="61">the five tabs</text><text class="h" x="20" y="112">TABS AND THEIR SCREENS</text><rect class="tab" x="20" y="122" width="192" height="28" rx="6"/><text class="tt" x="116.0" y="141" text-anchor="middle">Session</text><rect class="n ok" x="20" y="162" width="192" height="46" rx="6"/><text class="t" x="30" y="181">Protocol library</text><text class="tk" x="30" y="198">sends protocol_library</text><line class="ar" x1="116.0" y1="208" x2="116.0" y2="217" marker-end="url(#ac)"/><rect class="n ok" x="20" y="218" width="192" height="46" rx="6"/><text class="t" x="30" y="237">Protocol detail / editor</text><text class="tk" x="30" y="254">sends protocol_detail</text><line class="ar" x1="116.0" y1="264" x2="116.0" y2="273" marker-end="url(#ac)"/><rect class="n" x="20" y="274" width="192" height="46" rx="6"/><text class="t" x="30" y="302">Session setup</text><line class="ar" x1="116.0" y1="320" x2="116.0" y2="329" marker-end="url(#ac)"/><rect class="n" x="20" y="330" width="192" height="46" rx="6"/><text class="t" x="30" y="358">Session running</text><line class="ar" x1="116.0" y1="376" x2="116.0" y2="385" marker-end="url(#ac)"/><rect class="n" x="20" y="386" width="192" height="46" rx="6"/><text class="t" x="30" y="414">Session results</text><rect class="tab" x="222" y="122" width="192" height="28" rx="6"/><text class="tt" x="318.0" y="141" text-anchor="middle">History</text><rect class="n" x="222" y="162" width="192" height="46" rx="6"/><text class="t" x="232" y="190">Session history</text><rect class="n" x="222" y="218" width="192" height="46" rx="6"/><text class="t" x="232" y="246">EEG file download</text><rect class="tab" x="424" y="122" width="192" height="28" rx="6"/><text class="tt" x="520.0" y="141" text-anchor="middle">Consumables</text><rect class="n" x="424" y="162" width="192" height="46" rx="6"/><text class="t" x="434" y="190">Consumables</text><rect class="tab" x="626" y="122" width="192" height="28" rx="6"/><text class="tt" x="722.0" y="141" text-anchor="middle">Privacy</text><rect class="n" x="626" y="162" width="192" height="46" rx="6"/><text class="t" x="636" y="190">Research consent</text><rect class="n" x="626" y="218" width="192" height="46" rx="6"/><text class="t" x="636" y="246">Clinician access consent</text><rect class="n" x="626" y="274" width="192" height="46" rx="6"/><text class="t" x="636" y="302">Research portal</text><rect class="tab" x="828" y="122" width="192" height="28" rx="6"/><text class="tt" x="924.0" y="141" text-anchor="middle">Settings</text><rect class="n ok" x="828" y="162" width="192" height="46" rx="6"/><text class="t" x="838" y="181">Profile / account</text><text class="tk" x="838" y="198">sends account_settings</text><rect class="n ok" x="828" y="218" width="192" height="46" rx="6"/><text class="t" x="838" y="237">Pairing / firmware update</text><text class="tk" x="838" y="254">sends device_management</text><rect class="n" x="828" y="274" width="192" height="46" rx="6"/><text class="t" x="838" y="302">Limits</text><rect class="n" x="828" y="330" width="192" height="46" rx="6"/><text class="t" x="838" y="358">Backup and migration</text><rect class="n" x="828" y="386" width="192" height="46" rx="6"/><text class="t" x="838" y="414">Helmet owner (warranty)</text><line class="rail" x1="20" y1="452" x2="1020" y2="452"/><text class="s" x="20" y="470">Screens marked "sends" emit a screen_viewed event, stored under the installation's stable ID</text><line class="ar" x1="850" y1="452" x2="850" y2="494" marker-end="url(#ac)"/><line class="ar" x1="318.0" y1="264" x2="318.0" y2="446"/><line class="ar" x1="318.0" y1="458" x2="318.0" y2="494" marker-end="url(#ac)"/><text class="s" x="326.0" y="360">reads on the device</text><rect class="uh" x="20" y="498" width="620" height="180" rx="8"/><text class="pt" x="34" y="522">UHDR on the device: session history and consent state</text><text class="s" x="34" y="540">Encrypted; the user holds the key. Unchanged by this work.</text><rect class="who" x="34" y="556" width="130" height="28" rx="14"/><text class="t" x="99" y="575" text-anchor="middle">User</text><line class="ar" x1="170" y1="570" x2="216" y2="570" marker-end="url(#ac)"/><text class="s" x="192" y="564" text-anchor="middle">reads</text><text class="t" x="226" y="575">their own session history</text><rect class="who" x="34" y="594" width="130" height="28" rx="14"/><text class="t" x="99" y="613" text-anchor="middle">Clinician</text><line class="ar" x1="170" y1="608" x2="216" y2="608" marker-end="url(#ac)"/><text class="s" x="192" y="602" text-anchor="middle">reads</text><text class="t" x="226" y="613">session history of their own patients, per grant</text><rect class="who" x="34" y="632" width="130" height="28" rx="14"/><text class="t" x="99" y="651" text-anchor="middle">Consented study</text><line class="ar" x1="170" y1="646" x2="216" y2="646" marker-end="url(#ac)"/><text class="s" x="192" y="640" text-anchor="middle">reads</text><text class="t" x="226" y="651">only the detail the user agreed to share</text><line class="bar" x1="650" y1="498" x2="650" y2="678"/><rect class="an" x="660" y="498" width="360" height="180" rx="8"/><text class="pt" x="674" y="522">Analytics host: never reads UHDR</text><text class="s" x="674" y="540">Receives these screen names, with the time of each:</text><text class="tk" x="674" y="560">protocol_library</text><text class="tk" x="846" y="560">protocol_detail</text><text class="tk" x="674" y="579">account_settings</text><text class="tk" x="846" y="579">device_management</text><text class="s" x="674" y="622">Session and consent screens send nothing, so the</text><text class="s" x="674" y="638">host cannot tell when a session ran or that a</text><text class="s" x="674" y="654">clinician or study is involved.</text></svg>
